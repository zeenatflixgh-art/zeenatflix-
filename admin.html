<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Zeenatflix PRO MAX</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}#loginScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#ff1493,orange);display:flex;align-items:center;justify-content:center;z-index:9999}#loginBox{background:#111;padding:28px;border-radius:18px;width:90%;max-width:330px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6)}#loginBox input{width:100%;padding:14px;border-radius:25px;border:none;background:#1e1e1e;color:#fff;margin:12px 0;box-sizing:border-box;text-align:center;font-size:16px}#loginBox button{width:100%;padding:14px;border:none;border-radius:25px;background:#ff1493;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}header{background:linear-gradient(90deg,#ff1493,orange);padding:14px;border-radius:12px;margin:10px;text-align:center;font-weight:bold;font-size:18px}.wrap{padding:10px;max-width:700px;margin:auto}.card{background:#1e1e1e;padding:15px;border-radius:12px;margin:14px 0;border:1px solid #2a2a2a}select,input,textarea{width:100%;padding:12px;border-radius:8px;border:none;background:#2a2a2a;color:#fff;margin:8px 0;box-sizing:border-box}textarea{min-height:140px}.postBtn{background:#ff1493;color:#fff;width:100%;padding:15px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;font-size:16px;margin-top:10px}.voiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vBtn{background:#2a2a2a;color:#fff;border:1px solid #333;padding:10px;border-radius:20px;font-size:11px;cursor:pointer}.vBtn.active{background:#ff1493;border-color:#ff1493}.galleryBox{border:2px dashed #ff1493;border-radius:12px;padding:12px;text-align:center}#adminContent{display:none}</style></head><body>
<div id="loginScreen"><div id="loginBox"><h2>👑 CEO LOGIN</h2><p style="color:#aaa;font-size:13px">Enter Admin Password</p><input type="password" id="passInput" placeholder="••••••••"><button onclick="checkPass()">🔓 UNLOCK ADMIN</button><p id="err" style="color:#ff4757;font-size:13px;margin-top:10px"></p></div></div>

<div id="adminContent">
<header>👑 ADMIN - PRO MAX</header>
<div class="wrap">

<div class="card"><h3>📝 Create / Add Story to World+Home</h3>
<select id="mode" onchange="toggleMode()"><option value="existing">Add to Existing Poster</option><option value="new">Create New Story + Image</option></select>
<select id="posterList"></select>
<input id="title" placeholder="Story Title e.g. AMARA REVENGE">
<input id="shortDesc" placeholder="Short Description e.g. She returned to revenge...">
<div class="galleryBox"><p>🖼️ Choose Image From Phone Gallery</p><input type="file" id="imgFile" accept="image/*"><img id="preview" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;display:none;margin-top:10px"><input id="imgUrl" placeholder="Or paste image filename / URL" style="margin-top:10px"></div>
<textarea id="fullStory" placeholder="Write FULL story here... Use KING: Hello my daughter... QUEEN: My son... For different voices"></textarea>
<button class="postBtn" onclick="postStory()">🚀 POST TO WORLD + HOME</button>
</div>

<div class="card"><h3>🎬 Subtitles (Live)</h3><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="showSub" checked style="width:auto"> Show Subtitles</label><div id="subBox" style="background:#000;color:#ffeb3b;padding:12px;border-radius:8px;margin-top:10px;text-align:center;min-height:22px;border:1px solid #333">Subtitles will appear here when playing...</div></div>

<div class="card"><h3>🎙️ 20 REAL African Voices + Languages</h3>
<select id="lang"><option value="en-GH">🇬🇭 Ghana English</option><option value="en-NG">🇳🇬 Nigeria English</option><option value="en-GB">🇬🇧 British English</option><option value="ig-NG">🇳🇬 Igbo Language</option></select>
<div class="voiceGrid" style="margin-top:10px" id="voiceGrid"></div>
<div class="voiceGrid" style="margin-top:12px"><button class="vBtn" style="background:#00ff9d;color:#000" onclick="playAll()">▶️ PLAY ALL</button><button class="vBtn" style="background:orange;color:#000" onclick="pauseVoice()">⏸️ PAUSE</button><button class="vBtn" style="background:#ff4757;color:#fff" onclick="stopVoice()">⏹️ STOP</button><button class="vBtn" onclick="testVoices()">🔊 TEST 20 Voices</button></div>
</div>

<div class="card"><h3>📚 Posted Stories (<span id="count">0</span>)</h3><div id="postedList"></div><button onclick="logout()" style="background:#000;color:#fff;border:1px solid #333;padding:8px 14px;border-radius:20px;margin-top:12px">Logout</button></div>

</div></div>

<script>
const MY_PASS="Papaja6869$$";
function checkPass(){let p=document.getElementById('passInput').value;if(p===MY_PASS){localStorage.setItem('zeenat_admin_ok','yes');document.getElementById('loginScreen').style.display='none';document.getElementById('adminContent').style.display='block';initAdmin()}else{document.getElementById('err').innerText="❌ Wrong password!"} }
function logout(){localStorage.removeItem('zeenat_admin_ok');location.reload()}
if(localStorage.getItem('zeenat_admin_ok')==='yes'){document.getElementById('loginScreen').style.display='none';document.getElementById('adminContent').style.display='block';}
const posters=[{id:"static_0",t:"THE STOLEN BABY",i:"THE-STOLEN-BABY.jpg"},{id:"static_1",t:"MISSING BUT FOUND",i:"MISSING-BUT-FOUND.jpg"},{id:"static_2",t:"SECRETS OF THE LETTER",i:"SECRETS-OF-THE-LETTER.jpg"},{id:"static_3",t:"THE SLAVE TRADE",i:"THE-SLAVE-TRADE.jpg"},{id:"static_4",t:"THE ABANDONED HUTS",i:"THE-ABANDONED-HUTS.jpg"},{id:"static_5",t:"THE TWINS",i:"THE-TWINS.jpg"},{id:"static_6",t:"AMARA",i:"AMARA.jpg"},{id:"static_7",t:"THE FOOD SELLER",i:"THE-FOOD-SELLER.jpg"},{id:"static_8",t:"THE WHITE MAN",i:"THE-WHITE-MAN.jpg"},{id:"static_9",t:"THE RIVER BRIDE",i:"THE-RIVER-BRIDE.jpg"},{id:"static_10",t:"THE GENEROUS HUNTER",i:"THE-GENEROUS-HUNTER.jpg"},{id:"static_11",t:"MY STEPMOTHER'S DAUGHTER",i:"MY-STEPMOTHER.jpg"},{id:"static_12",t:"THE HEADMASTER SECRET",i:"THE-HEADMASTER-SECRET.jpg"},{id:"static_13",t:"FORGOTTEN PROMISE",i:"FORGOTTEN-PROMISE.jpg"},{id:"static_14",t:"THE MARKET GIRL",i:"THE-MARKET-GIRL.jpg"},{id:"static_15",t:"THE LIBRARY SECRET",i:"THE-LIBRARY-SECRET.jpg"},{id:"static_16",t:"DEATH OF NO RETURN",i:"DEATH-OF-NO-RETURN.jpg"},{id:"static_17",t:"FOREST OF NO RETURN",i:"FOREST-OF-NO-RETURN.jpg"},{id:"static_18",t:"SHATTERED VOWS",i:"SHATTERED-VOWS.jpg"}];
const voices=[
{name:"🎙️ Narrator Male",pitch:0.8,rate:0.9,gender:"male"},
{name:"🎤 Narrator Female",pitch:1.3,rate:1,gender:"female"},
{name:"👑 King Deep Male",pitch:0.5,rate:0.8,gender:"male"},
{name:"👸 Queen Mother",pitch:1.1,rate:0.9,gender:"female"},
{name:"🤴 Prince Young Male",pitch:1.1,rate:1.1,gender:"male"},
{name:"👸 Princess Amara",pitch:1.6,rate:1.1,gender:"female"},
{name:"👨 Old Man Chief",pitch:0.4,rate:0.7,gender:"male"},
{name:"👩 Old Woman",pitch:1.2,rate:0.8,gender:"female"},
{name:"👦 Boy Child",pitch:1.8,rate:1.2,gender:"male"},
{name:"👧 Girl Child",pitch:1.9,rate:1.3,gender:"female"},
{name:"💂 Guard Deep Voice",pitch:0.3,rate:0.9,gender:"male"},
{name:"🧹 Maid Soft Female",pitch:1.5,rate:1,gender:"female"},
{name:"⛪ Pastor Male",pitch:0.7,rate:0.85,gender:"male"},
{name:"⚔️ Warrior Male",pitch:0.6,rate:1,gender:"male"},
{name:"🧙 Witch Female",pitch:0.9,rate:0.8,gender:"female"},
{name:"👨 Husband",pitch:0.9,rate:1,gender:"male"},
{name:"👩 Wife",pitch:1.4,rate:1,gender:"female"},
{name:"👨‍💼 Friend Male",pitch:1,rate:1.1,gender:"male"},
{name:"👩‍💼 Friend Female",pitch:1.35,rate:1.05,gender:"female"},
{name:"😢 Crying Girl",pitch:1.7,rate:0.9,gender:"female"}
];
let currentVoiceIdx=1; let base64Img="";
function initAdmin(){let sel=document.getElementById('posterList');sel.innerHTML="";posters.forEach(p=>{sel.innerHTML+=`<option value="${p.id}">${p.t}</option>`});let grid=document.getElementById('voiceGrid');grid.innerHTML="";voices.forEach((v,i)=>{grid.innerHTML+=`<button class="vBtn ${i==1?'active':''}" onclick="selectVoice(${i})" id="vb${i}">${v.name}</button>`});document.getElementById('posterList').onchange=function(){let f=posters.find(x=>x.id==this.value);if(f){document.getElementById('title').value=f.t;document.getElementById('imgUrl').value=f.i;document.getElementById('preview').src=f.i;document.getElementById('preview').style.display='block';let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");document.getElementById('fullStory').value=stories[f.id]||"";}};loadPosted()}
function toggleMode(){let m=document.getElementById('mode').value;if(m=="new"){document.getElementById('title').value="";document.getElementById('posterList').innerHTML=`<option value="custom_${Date.now()}">-- New Custom Poster --</option>`;}}
function selectVoice(i){currentVoiceIdx=i;document.querySelectorAll('.vBtn').forEach(b=>b.classList.remove('active'));let el=document.getElementById('vb'+i);if(el)el.classList.add('active');speak("Hello I am "+voices[i].name);}
document.getElementById('imgFile').onchange=function(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){base64Img=ev.target.result;document.getElementById('preview').src=base64Img;document.getElementById('preview').style.display='block';document.getElementById('imgUrl').value=base64Img;};r.readAsDataURL(file)}
function postStory(){let pid=document.getElementById('posterList').value;let title=document.getElementById('title').value.trim();if(!title){alert("Add Title");return}let shortD=document.getElementById('shortDesc').value;let full=document.getElementById('fullStory').value;if(full.length<20){alert("Write full story at least 20 chars");return}let img=document.getElementById('imgUrl').value.trim()||"AMARA.jpg";let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");stories[pid]=full;localStorage.setItem('zeenat_poster_stories',JSON.stringify(stories));if(base64Img) localStorage.setItem('zeenat_poster_img_'+pid,base64Img);let movies=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");let obj={id:pid,title:title,desc:shortD,story:full,image:img,date:new Date().toISOString()};let idx=movies.findIndex(m=>m.id==pid);if(idx>=0)movies[idx]=obj;else movies.unshift(obj);localStorage.setItem('zeenatflix_movies',JSON.stringify(movies));alert("✅ POSTED TO WORLD + HOME! Now unlocked 🔓");loadPosted()}
function loadPosted(){let movies=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");document.getElementById('count').innerText=movies.length;let h="";movies.forEach(m=>{h+=`<div style='background:#2a2a2a;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center'><div><b>${m.title}</b><br><small style='color:#aaa'>${m.desc||''}</small></div><button onclick="delStory('${m.id}')" style='background:#ff4757;color:#fff;border:none;border-radius:12px;padding:6px 10px'>Del</button></div>`});document.getElementById('postedList').innerHTML=h||"No stories yet"}
function delStory(id){if(!confirm("Delete? Will lock poster again!"))return;let s=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");delete s[id];localStorage.setItem('zeenat_poster_stories',JSON.stringify(s));let m=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]").filter(x=>x.id!=id);localStorage.setItem('zeenatflix_movies',JSON.stringify(m));loadPosted()}
function getRealVoice(gender){let vs=speechSynthesis.getVoices();let lang=document.getElementById('lang').value||"en-GH";let filtered=vs.filter(v=>v.lang.includes(lang.split('-')[0]));if(gender=="female") filtered=filtered.filter(v=>v.name.toLowerCase().includes("female")||v.name.toLowerCase().includes("zira")||v.name.toLowerCase().includes("susan"));let v=filtered[0]||vs.find(x=>x.lang.includes('en'))||vs[0];return v}
function speak(text){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);let vinfo=voices[currentVoiceIdx];let rv=getRealVoice(vinfo.gender);if(rv)u.voice=rv;u.pitch=vinfo.pitch;u.rate=vinfo.rate;u.lang=document.getElementById('lang').value;u.onboundary=function(e){let sub=document.getElementById('subBox');if(sub&&document.getElementById('showSub').checked) sub.innerText=text.substring(0,e.charIndex+20)+"...";};document.getElementById('subBox').innerText=text.substring(0,80);speechSynthesis.speak(u);}
function playAll(){let txt=document.getElementById('fullStory').value;if(!txt){alert("Write story first");return}speak(txt)}
function pauseVoice(){if(speechSynthesis.speaking){speechSynthesis.pause()}}
function stopVoice(){speechSynthesis.cancel();document.getElementById('subBox').innerText="Stopped"}
function testVoices(){let i=0;function next(){if(i>=voices.length)return;selectVoice(i);speak(voices[i].name+" voice test. This is how I will sound in "+document.getElementById('lang').options[document.getElementById('lang').selectedIndex].text);i++;setTimeout(next,2500)}next()}
window.speechSynthesis.onvoiceschanged=function(){getRealVoice("female")}
if(localStorage.getItem('zeenat_admin_ok')==='yes'){initAdmin()}
</script></body></html>
