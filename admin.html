<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Zeenatflix</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}#loginScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#ff1493,orange);display:flex;align-items:center;justify-content:center;z-index:9999}#loginBox{background:#111;padding:25px;border-radius:15px;width:90%;max-width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}#loginBox input{width:100%;padding:14px;border-radius:25px;border:none;background:#1e1e1e;color:#fff;margin:10px 0;box-sizing:border-box;text-align:center;font-size:16px}#loginBox.btn{width:100%;padding:14px;border:none;border-radius:25px;background:#ff1493;color:#fff;font-weight:bold;cursor:pointer;font-size:16px}header{background:linear-gradient(90deg,#ff1493,orange);padding:14px;border-radius:12px;margin:10px;text-align:center;font-weight:bold;font-size:18px}.wrap{padding:10px;max-width:700px;margin:auto}.card{background:#1e1e1e;padding:15px;border-radius:12px;margin:12px 0} select,input,textarea{width:100%;padding:12px;border-radius:8px;border:none;background:#2a2a2a;color:#fff;margin:8px 0;box-sizing:border-box} textarea{min-height:150px}.postBtn{background:#ff1493;color:#fff;width:100%;padding:14px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;font-size:15px}.voiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vBtn{background:#2a2a2a;color:#fff;border:none;padding:10px;border-radius:20px;font-size:12px;cursor:pointer}.vBtn.active{background:#ff1493}.playAll{background:#00ff9d;color:#000}.pause{background:orange;color:#000}.stop{background:#ff4757;color:#fff} #adminContent{display:none}</style></head><body>

<div id="loginScreen"><div id="loginBox"><h2>👑 CEO LOGIN</h2><p style="font-size:13px;color:#ccc">Enter Admin Password</p><input type="password" id="passInput" placeholder="Password"><button class="btn" onclick="checkPass()">🔓 UNLOCK ADMIN</button><p id="err" style="color:#ff4757;font-size:13px;margin-top:8px"></p><p style="font-size:11px;color:#aaa;margin-top:10px">Hint: Papaja6869$$</p></div></div>

<div id="adminContent">
<header>👑 ADMIN - PRO MAX</header>
<div class="wrap">
<div class="card"><h3>📝 Create / Add Story to World+Home</h3>
<select id="mode"><option>Add to Existing Poster</option><option>Create New Poster</option></select>
<select id="posterList"></select>
<input id="title" placeholder="Story Title e.g. AMARA REVENGE">
<textarea id="shortDesc" placeholder="Short Description e.g. She returned to revenge..." style="min-height:70px"></textarea>
<textarea id="fullStory" placeholder="Write full story... Use KING: Hello my daughter... for different voices"></textarea>
<button class="postBtn" onclick="postStory()">💾 POST TO WORLD + HOME</button>
</div>

<div class="card"><h3>🎬 Subtitles (Live)</h3><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="showSub" checked style="width:auto"> Show Subtitles</label><div style="background:#000;color:#ffeb3b;padding:12px;border-radius:8px;margin-top:8px;text-align:center;min-height:20px" id="subBox">Subtitles will appear here when playing...</div></div>

<div class="card"><h3>🎙️ 20 REAL African Voices</h3><select id="lang"><option>🇬🇭 Ghana English</option><option>🇳🇬 Nigeria English</option><option>🇬🇧 British</option><option>Igbo</option></select><div class="voiceGrid" style="margin-top:10px">
<button class="vBtn">🎙️ Narrator Male</button><button class="vBtn active">🎤 Narrator Female</button>
<button class="vBtn">👑 King Deep Male</button><button class="vBtn">👸 Queen Mother</button>
<button class="vBtn">🤴 Prince Young Male</button><button class="vBtn">👸 Princess Amara</button>
<button class="vBtn">👨 Old Man Chief</button><button class="vBtn">👩 Old Woman</button>
<button class="vBtn">👦 Boy Child</button><button class="vBtn">👧 Girl Child</button>
<button class="vBtn">💂 Guard Deep Voice</button><button class="vBtn">🧹 Maid Soft Female</button>
<button class="vBtn">⛪ Pastor Male</button><button class="vBtn">⚔️ Warrior Male</button>
<button class="vBtn">🧙 Witch Female</button><button class="vBtn">👨 Husband</button>
<button class="vBtn">👩 Wife</button><button class="vBtn">👨‍💼 Friend Male</button>
<button class="vBtn">👩‍💼 Friend Female</button><button class="vBtn">😢 Crying Girl</button>
</div><div class="voiceGrid" style="margin-top:12px"><button class="vBtn playAll">▶️ PLAY ALL</button><button class="vBtn pause">⏸️ PAUSE</button><button class="vBtn stop">⏹️ STOP</button><button class="vBtn" style="background:#1e1e1e">🔊 TEST 20 Voices</button></div></div>

<div class="card"><h3>📚 Posted Stories</h3><div id="postedList"></div><button onclick="logout()" style="background:#000;color:#fff;border:1px solid #333;padding:8px 12px;border-radius:20px;margin-top:10px">Logout</button></div>
</div></div>

<script>
const MY_PASS="Papaja6869$$";
function checkPass(){let p=document.getElementById('passInput').value;if(p===MY_PASS){localStorage.setItem('zeenat_admin_ok','yes');document.getElementById('loginScreen').style.display='none';document.getElementById('adminContent').style.display='block';initAdmin()}else{document.getElementById('err').innerText="❌ Wrong password!"} }
function logout(){localStorage.removeItem('zeenat_admin_ok');location.reload()}
if(localStorage.getItem('zeenat_admin_ok')==='yes'){document.getElementById('loginScreen').style.display='none';document.getElementById('adminContent').style.display='block';}
const posters=["THE STOLEN BABY","MISSING BUT FOUND","SECRETS OF THE LETTER","THE SLAVE TRADE","THE ABANDONED HUTS","THE TWINS","AMARA","THE FOOD SELLER","THE WHITE MAN","THE RIVER BRIDE","THE GENEROUS HUNTER","MY STEPMOTHER'S DAUGHTER","THE HEADMASTER SECRET","FORGOTTEN PROMISE","THE MARKET GIRL","THE LIBRARY SECRET","DEATH OF NO RETURN","FOREST OF NO RETURN","SHATTERED VOWS"];
function initAdmin(){let sel=document.getElementById('posterList');sel.innerHTML="";posters.forEach((t,i)=>{sel.innerHTML+=`<option value="static_${i}">${t}</option>`});loadPosted()}
function postStory(){let id=document.getElementById('posterList').value;let title=document.getElementById('title').value||document.getElementById('posterList').options[document.getElementById('posterList').selectedIndex].text;let shortD=document.getElementById('shortDesc').value;let full=document.getElementById('fullStory').value;if(full.length<10)return alert("Write full story!");let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");stories[id]=full;localStorage.setItem('zeenat_poster_stories',JSON.stringify(stories));let movies=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");let obj={id:id,title:title,desc:shortD,story:full,image:localStorage.getItem('zeenat_poster_img_'+id)||"",date:new Date().toISOString()};let idx=movies.findIndex(m=>m.id==id);if(idx>=0)movies[idx]=obj;else movies.unshift(obj);localStorage.setItem('zeenatflix_movies',JSON.stringify(movies));alert("✅ Posted to WORLD + HOME! 🔓 Now unlocked!");loadPosted()}
function loadPosted(){let movies=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");let h="";movies.forEach(m=>{h+=`<div style='background:#2a2a2a;padding:8px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between'><span>${m.title}</span><button onclick="del('${m.id}')" style='background:#ff4757;color:#fff;border:none;border-radius:10px;padding:4px 8px'>Del</button></div>`});document.getElementById('postedList').innerHTML=h||"No stories yet"}
function del(id){if(!confirm("Delete? Will lock poster again!"))return;let s=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");delete s[id];localStorage.setItem('zeenat_poster_stories',JSON.stringify(s));let m=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]").filter(x=>x.id!=id);localStorage.setItem('zeenatflix_movies',JSON.stringify(m));loadPosted()}
if(localStorage.getItem('zeenat_admin_ok')==='yes'){initAdmin()}
</script></body></html>
