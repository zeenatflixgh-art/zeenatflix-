<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEENATFLIX CEO PANEL</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:15px;margin:0}
.topnav{margin-bottom:15px}a{color:#ff6b35;text-decoration:none}.card{background:#1a1a1a;border-radius:12px;padding:15px;margin-top:10px}
label{color:#00ff88;font-weight:bold;display:block;margin:15px 0 5px}
input,textarea,select{width:100%;background:#2a2a2a;border:none;color:#fff;padding:12px;border-radius:8px;box-sizing:border-box}
textarea{min-height:120px}
button{background:#ff0080;color:#fff;border:none;padding:14px;width:100%;border-radius:10px;font-weight:bold;margin-top:15px;cursor:pointer}
#loginBox{max-width:400px;margin:80px auto;text-align:center}
.posters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;min-height:100px;background:#111;border-radius:8px;padding:8px}
.posters img{width:100%;height:85px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;background:#222}
.posters img.selected{border-color:#00ff88;transform:scale(0.95)}
#debug{font-size:10px;color:#aaa;margin-top:5px}
</style>
</head>
<body>
<div id="loginBox">
<h1>👑 ZEENATFLIX CEO</h1>
<p>Enter CEO Password</p>
<input type="password" id="pwd" placeholder="Password">
<button onclick="login()">Login</button>
<p id="err" style="color:red"></p>
</div>

<div id="panel" style="display:none">
<div class="topnav"><a href="index.html">← Home</a> | <a href="world.html">🌍 World</a> | <a href="#" onclick="logout()">Logout</a></div>
<h2>👑 ZEENATFLIX CEO PANEL</h2>
<div class="card">
<h3>📤 Post Movie</h3>
<label>Movie Title *</label>
<input id="title" placeholder="e.g. THE STOLEN BABY">
<label>Subtitle / Tagline</label>
<input id="subtitle" placeholder="e.g. She Sold Her Baby For Money">
<label>Language / Voice Accent *</label>
<select id="lang">
<option value="en-US">🇺🇸 English - American (US)</option>
<option value="en-GB" selected>🇬🇧 English - British (UK)</option>
<option value="en-GH">🇬🇭 English - Ghana / Pidgin</option>
<option value="en-NG">🇳🇬 English - Nigeria</option>
<option value="tw-GH">🇬🇭 Twi - Ghana</option>
</select>
<label>Choose Image from Your 19 Posters - TAP to select 👇</label>
<div class="posters" id="posterGrid">Loading posters...</div>
<div id="debug"></div>
<label>Or Image URL (auto-filled when you tap poster)</label>
<input id="imgUrl" placeholder="https://...">
<label>Audio URL * (MP3)</label>
<input id="audioUrl" placeholder="https://...mp3">
<label>Full Story *</label>
<textarea id="fullStory" placeholder="Write full story here..."></textarea>
<button onclick="postMovie()">🌍 Post to Home + World</button>
</div>
</div>

<script>
const CEO_PASSWORD = "Papaja69$$";
// YOUR 19 - with 2 versions to catch space issue
const hardcoded = ["AMARA.jpg","THE-LIBRARY-SECRET.jpg","THE-RIVER-BRIDE.jpg","THE-STOLEN-BABY.jpg","THE-WHITE-MAN.jpg","THE-ABANDONED-HUTS.jpg","THE-TWINS.jpg","MISSING-BUT-FOUND.jpg","SECRETS-OF-THE-LETTER.jpg","THE-GENEROUS-HUNTER.jpg","THE-FOOD-SELLER.jpg","THE-SLAVE-TRADE.jpg","THE-HEADMASTER-SECRET.jpg","FORGOTTEN-PROMISE.jpg","THE-MARKET-GIRL.jpg","MY-STEPMOTHERS-DAUGHTER.jpg","FOREST-OF-NO-RETURN.jpg","SHATTERED-VOW.jpg","DEATH-OF-NO-RETURN.jpg","SECRETS -OF-THE-LETTER.jpg","MY STEPMOTHERS DAUGHTER.jpg"];

function login(){
 if(document.getElementById('pwd').value===CEO_PASSWORD){
  localStorage.setItem('zeenatflix_ceo','true');
  showPanel();
 } else {
  document.getElementById('err').innerText='Wrong password CEO!';
 }
}
function showPanel(){
 document.getElementById('loginBox').style.display='none';
 document.getElementById('panel').style.display='block';
 loadPosters();
}
function logout(){localStorage.removeItem('zeenatflix_ceo');location.reload();}
if(localStorage.getItem('zeenatflix_ceo')==='true'){showPanel();}
let selectedPoster="";

async function loadPosters(){
 const grid=document.getElementById('posterGrid');
 const debug=document.getElementById('debug');
 try{
   // Try to auto-load from GitHub API - REAL files in your repo!
   let res = await fetch('https://api.github.com/repos/zeenatflixgh-art/zeenatflix-/contents/posters');
   let files = await res.json();
   let names = files.filter(f=>f.name.match(/\.jpg|\.png/i)).map(f=>f.name);
   if(names.length>0){
     debug.innerText = 'Found '+names.length+' posters from GitHub API';
     grid.innerHTML = names.map(p=>`<img src="https://zeenatflixgh-art.github.io/zeenatflix-/posters/${encodeURIComponent(p)}" title="${p}" onclick="selectPoster(this,'./posters/${p}')" onerror="this.style.border='2px solid red'" >`).join('');
     return;
   }
 }catch(e){ debug.innerText='API failed, using manual list: '+e.message; }
 // Fallback hardcoded - DO NOT HIDE ON ERROR - show red border if broken so you can see
 grid.innerHTML = hardcoded.map(p=>`<div style="position:relative"><img src="./posters/${encodeURIComponent(p)}" title="${p}" onclick="selectPoster(this,'./posters/${p}')" onerror="this.style.opacity='0.3';this.nextElementSibling.style.display='block'"><div style="display:none;position:absolute;top:0;left:0;font-size:8px;color:red;word-break:break-all">${p}</div></div>`).join('');
 debug.innerText = 'Using manual 19 list - if image dark, file name not found in posters folder - check spelling!';
}

function selectPoster(el,src){
 document.querySelectorAll('.posters img').forEach(i=>i.classList.remove('selected'));
 el.classList.add('selected'); selectedPoster=src; document.getElementById('imgUrl').value=src;
 alert('Selected: '+src);
}
function postMovie(){
 const title=document.getElementById('title').value.trim();
 const subtitle=document.getElementById('subtitle').value.trim();
 const lang=document.getElementById('lang').value;
 let img=document.getElementById('imgUrl').value.trim()||selectedPoster;
 const audio=document.getElementById('audioUrl').value.trim();
 const story=document.getElementById('fullStory').value.trim();
 if(!title||!img||!audio||!story){alert('Fill Title, Image, Audio and Full Story CEO!');return;}
 const movie={id:Date.now(),title,subtitle,language:lang,image:img,audio,story,date:new Date().toISOString()};
 let custom=JSON.parse(localStorage.getItem('customMovies')||'[]'); custom.unshift(movie); localStorage.setItem('customMovies',JSON.stringify(custom));
 let world=JSON.parse(localStorage.getItem('worldMovies')||'[]'); world.unshift(movie); localStorage.setItem('worldMovies',JSON.stringify(world));
 alert('Posted CEO! Home + World everywhere! 🌍');
}
</script>
</body>
</html>
