<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeenatflix Ghana - Admin</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:12px;margin:0}
.card{background:#1a1a1a;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #333}
select,input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#2a2a2a;color:#fff;box-sizing:border-box;font-size:14px}
button{width:100%;padding:13px;margin:5px 0;border-radius:10px;border:none;font-weight:bold;color:#fff;cursor:pointer}
.voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.vbtn{background:#2a2a2a;font-size:12px;padding:10px}
.vbtn.active{background:#ff006a}
.green{background:#00c853}.orange{background:#ff9100}.red{background:#ff1744}.dark{background:#333}.pink{background:#e50914}
</style>
</head>
<body>

<div id="loginBox" class="card">
<h2>🔐 Admin Login</h2>
<input id="pass" type="password" placeholder="Enter Password">
<button onclick="login()" class="pink">Login</button>
</div>

<div id="adminPanel" style="display:none">
<div class="card" style="background:linear-gradient(90deg,#ff9100,#ff006a);text-align:center">
<h2>👑 YOUR 19 ORIGINAL STORIES - STATIC</h2>
<div style="display:flex;gap:10px;justify-content:center;margin-top:12px"><a href="index.html" style="background:#111;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none">🏠 Home</a><a href="world.html" style="background:#111;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none">🌍 World</a><button onclick="localStorage.clear();location.reload()" style="background:#000;color:#fff;padding:8px 14px;border-radius:8px;border:none">🚪 Logout</button></div>
</div>

<div class="card">
<h3>📝 Your 19 Posters - Static</h3>
<select id="ps"></select>
<input id="ptitle" placeholder="Title">
<input id="pdesc" placeholder="Short Description">
<p>🖼️ Choose Image From Phone</p>
<input type="file" id="imgIn" accept="image/*">
<textarea id="pfull" rows="8" placeholder="KING: hello&#10;QUEEN: hi my king"></textarea>
<button onclick="postToBoth()" style="background:linear-gradient(90deg,#ff006a,#ff9100)">💾 POST TO WORLD + HOME</button>
<div id="plist"></div>
</div>

<div class="card">
<div id="sub" style="background:#000;padding:14px;border-radius:12px;text-align:center;color:#ffeb3b">Hello from Zeenatflix.</div>
</div>

<div class="card">
<h3>🎙️ 20 Voices + Languages</h3>
<select id="lang"></select>
<div class="voice-grid" id="vgrid"></div>
<button class="green" onclick="playAll()">▶️ PLAY ALL</button>
<button class="orange" onclick="pauseAll()">⏸️ PAUSE</button>
<button class="red" onclick="stopAll()">⏹️ STOP</button>
<button class="dark" onclick="test20()">🎧 TEST 20</button>
</div>
</div>

<script>
// ===== YOUR LANGUAGES =====
const MY_LANGS=[
{code:"en-GH",name:"🇬🇭 Ghana English"},
{code:"en-NG",name:"🇳🇬 Nigeria English"},
{code:"en-GB",name:"🇬🇧 British English"},
{code:"en-GB",name:"🇬🇧 UK English"},
{code:"ig-NG",name:"🇳🇬 Igbo"},
{code:"yo-NG",name:"🇳🇬 Yoruba"},
{code:"tw-GH",name:"🇬🇭 Twi"},
{code:"ak-GH",name:"🇬🇭 Akan"},
{code:"ha-NG",name:"🇳🇬 Hausa"},
{code:"en-US",name:"🇺🇸 US English"}
];
function loadGhanaVoices(){
 let sel=document.getElementById('lang');
 if(!sel) return;
 sel.innerHTML="";
 MY_LANGS.forEach(L=>{
  let o=document.createElement('option');
  o.value=L.code; o.textContent=L.name;
  sel.appendChild(o);
 });
}
speechSynthesis.onvoiceschanged=loadGhanaVoices;
setTimeout(loadGhanaVoices,600);

// ===== HIDDEN PASSWORD - WORKING =====
const _0x=[80,97,112,97,106,97,54,56,54,57,36,36];
const PASS=_0x.map(c=>String.fromCharCode(c)).join('');


// ===== YOUR REAL 19 STATIC =====
const myTitles={
"static_1":"AMARA",
"static_2":"THE-LIBRARY-SECRET",
"static_3":"THE-RIVER-BRIDE",
"static_4":"THE-STOLEN-BABY",
"static_5":"THE-WHITE-MAN",
"static_6":"THE-ABANDONED-HUTS",
"static_7":"THE-TWINS",
"static_8":"MISSING-BUT-FOUND",
"static_9":"SECRETS-OF-THE-LETTER",
"static_10":"THE-GENEROUS-HUNTER",
"static_11":"THE-FOOD-SELLER",
"static_12":"THE-SLAVE-TRADE",
"static_13":"THE-HEADMASTER-SECRET",
"static_14":"FORGOTTEN-PROMISE",
"static_15":"THE-MARKET-GIRL",
"static_16":"MY-STEPMOTHERS-DAUGHTER",
"static_17":"FOREST-OF-NO-RETURN",
"static_18":"SHATTERED-VOW",
"static_19":"DEATH-OF-NO-RETURN"
};
const posters=Object.keys(myTitles);
const voiceNames=["Narrator Male","Narrator Female","King Deep","Queen Mother","Prince","Princess Amara","Old Chief","Old Woman","Boy Child","Girl Child","Guard Deep","Maid Soft","Pastor Male","Warrior Male","Witch Female","Husband","Wife","Friend Male","Friend Female","Crying Girl"];
const voiceConfig=[{p:0.8,r:0.85},{p:1.3,r:1.05},{p:0.6,r:0.8},{p:1.1,r:0.9},{p:0.9,r:1.0},{p:1.4,r:1.1},{p:0.5,r:0.75},{p:1.2,r:0.85},{p:1.5,r:1.2},{p:1.6,r:1.15},{p:0.6,r:0.85},{p:1.3,r:1.0},{p:0.85,r:0.9},{p:0.7,r:0.9},{p:0.9,r:0.7},{p:0.9,r:0.95},{p:1.2,r:1.0},{p:0.95,r:1.0},{p:1.15,r:1.0},{p:1.5,r:0.9}];
let curVoice=0, curPoster="static_1", curLang="en-GH";
let allPosts=JSON.parse(localStorage.getItem('posts')||'[]');
let lastImage="";

document.getElementById('imgIn').addEventListener('change',function(){
 let f=this.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=e=>{lastImage=e.target.result;}; r.readAsDataURL(f);
});

function init(){
 let s=document.getElementById('ps');
 s.innerHTML="";
 posters.forEach(p=>{
  let o=document.createElement('option');
  o.value=p; o.textContent=myTitles[p]+" ("+p+")";
  s.appendChild(o);
 });
 s.value=curPoster;
 document.getElementById('ptitle').value=myTitles[curPoster];
 s.onchange=function(){curPoster=this.value; document.getElementById('ptitle').value=myTitles[this.value];};
 document.getElementById('lang').onchange=function(){curLang=this.value;};
 let g=document.getElementById('vgrid');
 g.innerHTML="";
 voiceNames.forEach((name,i)=>{
  let b=document.createElement('button');
  b.className='vbtn'+(i==0?' active':''); b.id='v'+i; b.textContent=name;
  b.onclick=function(){
   document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('active'));
   this.classList.add('active'); curVoice=i;
   let ut=new SpeechSynthesisUtterance("I am "+name);
   ut.pitch=voiceConfig[i].p; ut.rate=voiceConfig[i].r;
   speechSynthesis.cancel(); speechSynthesis.speak(ut);
   document.getElementById('sub').textContent=name;
  };
  g.appendChild(b);
 });
 renderList(); loadGhanaVoices();
}

function login(){
 let p=document.getElementById('pass').value.trim();
 if(p===PASS){
  localStorage.setItem('admin_ok','1');
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminPanel').style.display='block';
  init();
 } else alert('Wrong password! Use Papaja6869$$');
}
function logout(){localStorage.removeItem('admin_ok');location.reload();}
if(localStorage.getItem('admin_ok')=='1'){
 document.getElementById('loginBox').style.display='none';
 document.getElementById('adminPanel').style.display='block';
 setTimeout(init,700);
}

function postToBoth(){
 let title=document.getElementById('ptitle').value||myTitles[curPoster];
 let desc=document.getElementById('pdesc').value||"";
 let full=document.getElementById('pfull').value||"";
 if(!title) return alert('Add title');
 let post={id:curPoster,title:title,desc:desc,full:full,img:lastImage,time:Date.now()};
 allPosts=allPosts.filter(p=>p.id!=curPoster);
 allPosts.unshift(post);
 localStorage.setItem('posts',JSON.stringify(allPosts));
 // Also post to world - save to worldPosts
 let worldPosts=JSON.parse(localStorage.getItem('worldPosts')||'[]');
 worldPosts=worldPosts.filter(p=>p.id!=curPoster);
 worldPosts.unshift(post);
 localStorage.setItem('worldPosts',JSON.stringify(worldPosts));
 renderList();
 alert('✅ POSTED: '+title+' to WORLD + HOME!');
}
function renderList(){
 let d=document.getElementById('plist');
 if(!d) return;
 d.innerHTML=allPosts.map(p=>`<div style='background:#222;padding:8px;margin:5px 0;border-radius:8px'>✅ ${p.title} - ${p.id}</div>`).join('');
}
function playAll(){ /* same */
 let txt=document.getElementById('pfull').value; if(!txt) return;
 let lines=txt.split('\n'); let i=0;
 function nxt(){
  if(i>=lines.length) return;
  let l=lines[i]; if(!l.trim()){i++;nxt();return;}
  let ut=new SpeechSynthesisUtterance(l.replace(/^.*?:/,''));
  ut.pitch=voiceConfig[curVoice].p; ut.rate=voiceConfig[curVoice].r;
  ut.onend=function(){i++;nxt();};
  document.getElementById('sub').textContent=l;
  speechSynthesis.speak(ut);
 }
 speechSynthesis.cancel(); nxt();
}
function pauseAll(){speechSynthesis.pause();}
function stopAll(){speechSynthesis.cancel();}
function test20(){
 let i=0; function nxt(){
  if(i>=20) return;
  let ut=new SpeechSynthesisUtterance("I am "+voiceNames[i]);
  ut.pitch=voiceConfig[i].p; ut.rate=voiceConfig[i].r;
  ut.onend=function(){i++;setTimeout(nxt,300);};
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('active'));
  document.getElementById('v'+i).classList.add('active');
  document.getElementById('sub').textContent=voiceNames[i];
  speechSynthesis.speak(ut);
 }
 speechSynthesis.cancel(); nxt();
}
</script>
</body>
</html>
