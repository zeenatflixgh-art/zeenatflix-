<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO ADMIN - Add Story to Poster</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:10px}
.box{background:#1e1e1e;padding:15px;border-radius:12px;margin-bottom:15px}
.box h3{margin:0 0 10px;color:#00ff9d}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:none;background:#2a2a2a;color:#fff;margin-bottom:10px;box-sizing:border-box}
button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-bottom:8px}
.save{background:#00ff9d;color:#000}
.del{background:#ff4d6d;color:#fff}
.poster-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:320px;overflow-y:auto;background:#121212;padding:10px;border-radius:10px}
.p-item{background:#2a2a2a;padding:6px;border-radius:8px;cursor:pointer;text-align:center;font-size:11px}
.p-item.selected{border:2px solid #00ff9d}
.p-item img{width:100%;height:80px;object-fit:cover;border-radius:6px;display:block}
.header{background:linear-gradient(90deg,#ff1493,orange);padding:15px;border-radius:15px;text-align:center;margin-bottom:15px}
.header a{color:#fff;text-decoration:none;font-weight:bold;background:rgba(0,0,0,0.3);padding:6px 12px;border-radius:20px;margin:2px;display:inline-block}
</style>
</head>
<body>
