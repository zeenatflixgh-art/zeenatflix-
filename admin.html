<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeenatflix Ghana - Admin</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:10px;margin:0}
.card{background:#1a1a1a;border-radius:16px;padding:14px;margin:10px 0}
select,input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#2a2a2a;color:#fff}
button{width:100%;padding:13px;margin:5px 0;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vbtn{background:#2a2a2a;font-size:12px;padding:12px;border-radius:10px;color:#fff}
.vbtn.active{background:#ff0066}
.green{background:#00c853;color:#fff}.orange{background:#ff6d00;color:#fff}.pink{background:#ff0066;color:#fff}.dark{background:#333;color:#fff}
#sub{background:#000;padding:14px;border:2px solid #ff0066;border-radius:12px;min-height:70px;display:none;margin-top:10px}
#subText{color:#fff;font-size:16px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div id="loginBox" class="card">
<h2>🔐 Admin Login</h2>
<input id="pass" type="password" placeholder="Enter Password">
<button onclick="login()" class="pink">Login</button>
</div>

<div id="adminPanel" style="display:none">
<div class="card" style="background:linear-gradient(45deg,#ff0066,#9900ff)">
<h2>👑 YOUR 19 ORIGINAL STORIES - STATIC</h2>
<div style="display:flex;gap:10px;justify-content:center"></div>
</div>

<div class="card">
<h3>📝 Your 19 Posters - Static</h3>
<select id="ps"></select>
<input id="ptitle" placeholder="Title">
<textarea id="pdesc" rows="2" placeholder="Short Description"></textarea>
<textarea id="pfull" rows="10" placeholder="Full Movie Script
Example:
KING: My son come here
QUEEN: Yes my king
PRINCESS AMARA: Father I am scared"></textarea>
<input type="file" id="imgIn" accept="image/*">
<select id="lang"></select>
<div id="vgrid" class="voice-grid"></div>
<div id="sub"><div id="subText">🎬 Subtitles appear here...</div></div>
<button onclick="playAll()" class="green">▶️ PLAY MOVIE</button>
<button onclick="pauseAll()" class="orange">⏸️ PAUSE</button>
<button onclick="stopAll()" class="dark">⏹️ STOP</button>
<button class="dark" onclick="test20()">🔊 TEST 20 VOICES</button>
<button onclick="postToBoth()" class="pink">📤 POST TO WORLD + HOME</button>
<button onclick="logout()" class="dark">Logout</button>
</div>
<div class="card"><h3>📋 Posted</h3><div id="plist"></div></div>
</div>

<script>
const PASS="Papaja6869$$";
const myTitles={p1:"The Lost Crown",p2:"Village Betrayal",p3:"Queen Mother's Curse",p4:"Prince of Ashanti",p5:"The Royal Maid",p6:"Blood of the Throne",p7:"Love of A Princess",p8:"The Old Chief",p9:"Warrior's Return",p10:"Witch of the Forest",p11:"Husband's Secret",p12:"Wife's Revenge",p13:"The Twins",p14:"The Palace Guard",p15:"Pastor's Daughter",p16:"The Orphan",p17:"King and Queen",p18:"The Kingmaker",p19:"Princess Amara"};
const posters=Object.keys(myTitles);
let curPoster="p1"; let curVoice=0; let curLang="en-GH";
let allPosts=JSON.parse(localStorage.getItem('posts')||'[]');
let lastImage="";

const MY_LANGS=[
{code:"en-GH",name:"🇬🇭 Ghana English"},
{code:"en-NG",name:"🇳🇬 Nigeria English"},
{code:"en-GB",name:"🇬🇧 British English"},
{code:"en-US",name:"🇺🇸 US English"},
{code:"ig-NG",name:"🇳🇬 Igbo"},
{code:"yo-NG",name:"🇳🇬 Yoruba"},
{code:"tw-GH",name:"🇬🇭 Twi"},
{code:"ak-GH",name:"🇬🇭 Akan"},
{code:"ha-NG",name:"🇳🇬 Hausa"}
];

let voices=[];

function loadGhanaVoices(){
 let sel=document.getElementById('lang');
 let grid=document.getElementById('vgrid');
 if(!sel||!grid) return;
 sel.innerHTML="";
 MY_LANGS.forEach(L=>{
  let o=document.createElement('option'); o.value=L.code; o.textContent=L.name; sel.appendChild(o);
 });
 voices=speechSynthesis.getVoices();
 let names=["Narrator Male","Narrator Female","King Deep","Queen Mother","Prince","Princess Amara","Old Chief","Old Woman","Boy Child","Girl Child","Guard Deep","Maid Soft","Pastor Male","Warrior Male","Witch Female","Husband","Wife","Friend Male","Friend Female","Crying Girl"];
 grid.innerHTML="";
 names.forEach((n,i)=>{
  let b=document.createElement('button'); b.textContent=n; b.className='vbtn'+(i==0?' active':''); b.id='v'+i;
  b.onclick=()=>{
    document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); curVoice=i;
    document.getElementById('sub').style.display='block';
    document.getElementById('subText').textContent=n+" speaking...";
    playVoice(n);
  };
  grid.appendChild(b);
 });
}
speechSynthesis.onvoiceschanged=loadGhanaVoices;
setTimeout(loadGhanaVoices,600);

function getVoice(){
 let c=document.getElementById('lang')?.value||'en-GH';
 return voices.find(v=>v.lang.includes(c))||voices.find(v=>v.lang.includes('en'))||voices[0];
}
function unlockAudio(){ let u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }

function playVoice(name){
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(name+" is speaking. This is "+name+" voice test for Zeenatflix.");
 u.voice=getVoice();
 if(name.includes('Deep')||name.includes('King')||name.includes('Chief')||name.includes('Guard')){u.pitch=0.5; u.rate=0.8;}
 if(name.includes('Queen')||name.includes('Princess')||name.includes('Girl')||name.includes('Maid')||name.includes('Mother')||name.includes('Wife')){u.pitch=1.5; u.rate=1.0;}
 if(name.includes('Boy')||name.includes('Child')){u.pitch=1.8; u.rate=1.2;}
 if(name.includes('Crying')){u.pitch=1.6; u.rate=0.9;}
 speechSynthesis.speak(u);
}

function playAll(){
 unlockAudio();
 let txt=document.getElementById('pfull')?.value||"KING: hello\nQUEEN: hi my king";
 speechSynthesis.cancel();
 let lines=txt.split('\n').filter(l=>l.trim());
 let i=0;
 const map={'KING':'King Deep','QUEEN':'Queen Mother','PRINCE':'Prince','PRINCESS AMARA':'Princess Amara','PRINCESS':'Princess Amara','NARRATOR MALE':'Narrator Male','NARRATOR FEMALE':'Narrator Female','OLD CHIEF':'Old Chief','OLD WOMAN':'Old Woman','BOY CHILD':'Boy Child','GIRL CHILD':'Girl Child','GUARD DEEP':'Guard Deep','MAID SOFT':'Maid Soft','PASTOR MALE':'Pastor Male','WARRIOR MALE':'Warrior Male','WITCH FEMALE':'Witch Female','HUSBAND':'Husband','WIFE':'Wife','FRIEND MALE':'Friend Male','FRIEND FEMALE':'Friend Female','CRYING GIRL':'Crying Girl'};
 let subBox=document.getElementById('sub'); let subText=document.getElementById('subText');
 subBox.style.display='block';
 function next(){
  if(i>=lines.length){ subText.innerHTML="✅ Movie Finished"; return; }
  let line=lines[i]; let who=line.split(':')[0]?.trim().toUpperCase(); let say=line.split(':').slice(1).join(':').trim()||line;
  let vName=map[who]||'Narrator Male';
  subText.innerHTML='<b style="color:yellow">'+vName+':</b> '+say;
  document.querySelectorAll('.vbtn').forEach(b=>{ if(b.textContent===vName) b.classList.add('active'); else b.classList.remove('active'); });
  let ut=new SpeechSynthesisUtterance(say);
  ut.voice=getVoice();
  if(vName.includes('King')||vName.includes('Deep')||vName.includes('Chief')){ut.pitch=0.6; ut.rate=0.8;}
  if(vName.includes('Queen')||vName.includes('Princess')||vName.includes('Girl')||vName.includes('Maid')||vName.includes('Mother')){ut.pitch=1.4; ut.rate=1.0;}
  if(vName.includes('Boy')||vName.includes('Child')){ut.pitch=1.7; ut.rate=1.1;}
  ut.onboundary=(e)=>{
    let pos=e.charIndex; let len=e.charLength||4;
    let before=say.substring(0,pos); let word=say.substring(pos,pos+len); let after=say.substring(pos+len);
    subText.innerHTML='<b style="color:yellow">'+vName+':</b> '+before+'<span style="background:yellow;color:#000;padding:2px 4px;border-radius:4px">'+word+'</span>'+after;
  };
  ut.onend=()=>{ i++; setTimeout(next,500); };
  speechSynthesis.speak(ut);
 }
 next();
}
function pauseAll(){ if(speechSynthesis.paused) speechSynthesis.resume(); else speechSynthesis.pause(); }
function stopAll(){ speechSynthesis.cancel(); let sb=document.getElementById('sub'); if(sb) sb.style.display='none'; }
function test20(){
 let names=["Narrator Male","Narrator Female","King Deep","Queen Mother","Prince","Princess Amara","Old Chief","Old Woman","Boy Child","Girl Child","Guard Deep","Maid Soft","Pastor Male","Warrior Male","Witch Female","Husband","Wife","Friend Male","Friend Female","Crying Girl"];
 let idx=0;
 function nxt(){
  if(idx>=names.length) return;
  document.getElementById('sub').style.display='block';
  document.getElementById('subText').textContent='🔊 '+names[idx];
  let u=new SpeechSynthesisUtterance(names[idx]);
  u.voice=getVoice();
  u.onend=()=>{idx++; setTimeout(nxt,400);};
  speechSynthesis.speak(u);
 }
 speechSynthesis.cancel(); nxt();
}

document.getElementById('imgIn').addEventListener('change',function(){
 let f=this.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=(e)=>{lastImage=e.target.result}; r.readAsDataURL(f);
});
function init(){
 let s=document.getElementById('ps'); s.innerHTML="";
 posters.forEach(p=>{ let o=document.createElement('option'); o.value=p; o.textContent=myTitles[p]+" ("+p+")"; s.appendChild(o); });
 s.value=curPoster;
 document.getElementById('ptitle').value=myTitles[curPoster]||"";
 s.onchange=function(){curPoster=this.value; document.getElementById('ptitle').value=myTitles[curPoster]||"";};
 document.getElementById('lang').onchange=()=>{curLang=document.getElementById('lang').value};
 renderList(); loadGhanaVoices();
}
function login(){ let p=document.getElementById('pass').value.trim(); if(p===PASS){ localStorage.setItem('admin_ok','1'); document.getElementById('loginBox').style.display='none'; document.getElementById('adminPanel').style.display='block'; init(); } else alert('Wrong password! Use Papaja6869$$'); }
function logout(){localStorage.removeItem('admin_ok'); location.reload();}
if(localStorage.getItem('admin_ok')=='1'){ document.getElementById('loginBox').style.display='none'; document.getElementById('adminPanel').style.display='block'; setTimeout(init,700); }
function postToBoth(){
 let title=document.getElementById('ptitle').value; let desc=document.getElementById('pdesc').value; let full=document.getElementById('pfull').value;
 if(!title) return alert('Add title');
 let post={id:curPoster,title:title,desc:desc,full:full,img:lastImage,voice:curVoice,lang:curLang};
 allPosts=allPosts.filter(p=>p.id!=curPoster); allPosts.unshift(post);
 localStorage.setItem('posts',JSON.stringify(allPosts));
 let worldPosts=JSON.parse(localStorage.getItem('worldPosts')||'[]');
 worldPosts=worldPosts.filter(p=>p.id!=curPoster); worldPosts.unshift(post);
 localStorage.setItem('worldPosts',JSON.stringify(worldPosts));
 renderList(); alert('✅ POSTED: '+title+' to WORLD + HOME!');
}
function renderList(){
 let d=document.getElementById('plist'); if(!d) return;
 d.innerHTML=allPosts.map(p=>`<div style='background:#222;padding:8px;margin:5px 0;border-radius:8px'>${p.title} - ${p.id}</div>`).join('');
}
</script>
</body>
</html>
