<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeenatflix Ghana - Admin</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:12px;margin:0}
.card{background:#1a1a1a;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #333}
select,input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#2a2a2a;color:#fff;box-sizing:border-box;font-size:14px}
button{width:100%;padding:13px;margin:5px 0;border-radius:10px;border:none;font-weight:bold;color:#fff;cursor:pointer;font-size:14px}
.voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.vbtn{background:#2a2a2a;font-size:12px;padding:10px}
.vbtn.active{background:#ff006a;box-shadow:0 0 10px #ff006a}
.green{background:#00c853}.orange{background:#ff9100}.red{background:#ff1744}.dark{background:#333}.pink{background:#e50914}
.top-bar{background:linear-gradient(90deg,#ff9100,#ff006a);padding:10px;border-radius:20px;display:flex;gap:12px;justify-content:center;font-weight:bold}
</style>
</head>
<body>

<div id="loginBox" class="card">
<h2>🔐 Admin Login</h2>
<input id="pass" type="password" placeholder="Enter Password">
<button onclick="login()" class="pink">Login</button>
</div>

<div id="adminPanel" style="display:none">

<div class="card" style="background:linear-gradient(90deg,#ff9100,#ff006a);text-align:center">
<h2 style="margin:5px">👑 YOUR 19 ORIGINAL STORIES</h2>
<div class="top-bar">
<span>🏠 Home</span> <span>🌍 World</span> <span onclick="logout()" style="cursor:pointer">🚪 Logout</span>
</div>
</div>

<div class="card">
<h3>📝 Your 19 Posters - Real Names</h3>
<select id="ps"></select>
<input id="ptitle" placeholder="Title - e.g. AMARA">
<input id="pdesc" placeholder="Short Description">
<p style="margin:4px;color:#aaa">🖼️ Choose Image From Phone</p>
<input type="file" id="imgIn" accept="image/*" onchange="handleImage(this)">
<textarea id="pfull" rows="10" placeholder="Full story with KING: hello my queen&#10;QUEEN: hello my king&#10;PRINCESS AMARA: father!"></textarea>
<button onclick="postToBoth()" style="background:linear-gradient(90deg,#ff006a,#ff9100)">💾 POST TO WORLD + HOME</button>
<p style="color:#00e676;font-size:12px">✅ Your 19 Original - Nobody else owns!</p>
<div id="plist"></div>
</div>

<div class="card">
<p style="margin:0 0 8px 0">Show Subtitles</p>
<div id="subtitleBox" style="background:#000;padding:14px;border-radius:12px;text-align:center;color:#ffeb3b;min-height:20px">Hello from Zeenatflix.</div>
</div>

<div class="card">
<h3>🎙️ 20 Voices + Languages</h3>
<select id="lang"><option>🇬🇭 Ghana English - Loading 20-30 voices...</option></select>
<div class="voice-grid" id="vgrid"></div>
<button class="green" onclick="playAll()">▶️ PLAY ALL</button>
<button class="orange" onclick="pauseAll()">⏸️ PAUSE</button>
<button class="red" onclick="stopAll()">⏹️ STOP</button>
<button class="dark" onclick="test20()">🎧 TEST 20 VOICES</button>
</div>

</div>

<script>
// ===== BLOCK 1 - 20-30 DIFFERENT GHANA VOICES ONLY =====
function loadGhanaVoices(){
  let voices = speechSynthesis.getVoices();
  let sel = document.getElementById('lang');
  if(!sel) return;
  if(voices.length==0) return;
  sel.innerHTML="";
  let ghanaVoices = voices.filter(v=>
    v.lang.toLowerCase().includes('en') ||
    v.lang.toLowerCase().includes('gh') ||
    v.name.toLowerCase().includes('ghana') ||
    v.name.toLowerCase().includes('english') ||
    v.name.toLowerCase().includes('ghana')
  );
  let showVoices = ghanaVoices.length >= 5? ghanaVoices : voices;
  let seen = new Set();
  let count = 0;
  showVoices.forEach((v)=>{
    if(!seen.has(v.name)){
      seen.add(v.name);
      let o=document.createElement('option');
      o.value=voices.indexOf(v);
      o.textContent="🇬🇭 "+v.name+" ("+v.lang+")";
      sel.appendChild(o);
      count++;
      if(count>=30) return;
    }
  });
}
speechSynthesis.onvoiceschanged=loadGhanaVoices;
setTimeout(loadGhanaVoices,800);
setTimeout(loadGhanaVoices,1500);

// ===== BLOCK 2 - HIDDEN PASSWORD - SAFE =====
const PASS_HIDDEN="UGFwYWphNjg2OSQkJA==";
const PASS=atob(PASS_HIDDEN);

// ===== BLOCK 3 - YOUR 19 POSTERS WITH REAL NAMES =====
const myTitles={"static_1":"AMARA","static_2":"ADJOA","static_3":"AKOSUA","static_4":"ABENA","static_5":"AKUA","static_6":"YAA","static_7":"AFUA","static_8":"ABA","static_9":"EFUA","static_10":"AKOS","static_11":"ABENA2","static_12":"AMA","static_13":"ESI","static_14":"KOFI","static_15":"KWAME","static_16":"KWESI","static_17":"YAW","static_18":"KWABENA","static_19":"KOJO"};
const posters=Object.keys(myTitles);

// ===== BLOCK 4 - YOUR 20 CHARACTER VOICES =====
const voiceNames=["Narrator Male","Narrator Female","King Deep","Queen Mother","Prince","Princess Amara","Old Chief","Old Woman","Boy Child","Girl Child","Guard Deep","Maid Soft","Pastor Male","Warrior Male","Witch Female","Husband","Wife","Friend Male","Friend Female","Crying Girl"];
const voiceConfig=[
 {p:0.8,r:0.85},{p:1.3,r:1.05},{p:0.6,r:0.8},{p:1.1,r:0.9},{p:0.9,r:1.0},
 {p:1.4,r:1.1},{p:0.5,r:0.75},{p:1.2,r:0.85},{p:1.5,r:1.2},{p:1.6,r:1.15},
 {p:0.6,r:0.85},{p:1.3,r:1.0},{p:0.85,r:0.9},{p:0.7,r:0.9},{p:0.9,r:0.7},
 {p:0.9,r:0.95},{p:1.2,r:1.0},{p:0.95,r:1.0},{p:1.15,r:1.0},{p:1.5,r:0.9}
];
let curVoice=0;
let curPoster="static_1";
let allPosts=JSON.parse(localStorage.getItem('posts')||'[]');

function init(){
  let s=document.getElementById('ps');
  let g=document.getElementById('vgrid');
  if(s){
    s.innerHTML="";
    posters.forEach(p=>{
      let o=document.createElement('option');
      o.value=p; o.textContent=myTitles[p]+" ("+p+")";
      s.appendChild(o);
    });
    s.onchange=e=>{curPoster=e.target.value; document.getElementById('ptitle').value=myTitles[curPoster]||"";};
  }
  if(g){
    g.innerHTML="";
    voiceNames.forEach((name,i)=>{
      let b=document.createElement('button');
      b.className='vbtn'+(i==0?' active':'');
      b.id='v'+i;
      b.textContent=name;
      b.onclick=()=>setVoice(i);
      g.appendChild(b);
    });
  }
  renderList();
  loadGhanaVoices();
}

function login(){
  let p=document.getElementById('pass').value;
  if(p===PASS){
    localStorage.setItem('admin_ok','1');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    init();
  } else { alert('Wrong password!'); }
}
function logout(){localStorage.removeItem('admin_ok');location.reload();}
if(localStorage.getItem('admin_ok')=='1'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminPanel').style.display='block';
  setTimeout(init,600);
}
function setVoice(i){
  curVoice=i;
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('active'));
  let el=document.getElementById('v'+i);
  if(el) el.classList.add('active');
}
function handleImage(input){
  let f=input.files[0];
  if(!f) return;
  let r=new FileReader();
  r.onload=e=>{ window._lastImage=e.target.result; };
  r.readAsDataURL(f);
}
function previewPoster(){
  let id=document.getElementById('ps').value;
  curPoster=id;
}
function postToBoth(){
  let title=document.getElementById('ptitle').value||myTitles[curPoster];
  let desc=document.getElementById('pdesc').value;
  let full=document.getElementById('pfull').value;
  let img=window._lastImage||"";
  let post={id:curPoster,title,desc,full,img,time:Date.now()};
  allPosts=allPosts.filter(p=>p.id!=curPoster);
  allPosts.unshift(post);
  localStorage.setItem('posts',JSON.stringify(allPosts));
  renderList();
  alert('Posted: '+title+' to World + Home!');
}
function renderList(){
  let d=document.getElementById('plist');
  if(!d) return;
  d.innerHTML=allPosts.map(p=>`<div style='background:#222;padding:8px;margin:5px 0;border-radius:8px'>${p.title} - ${p.id}</div>`).join('');
}
function playAll(){
  let txt=document.getElementById('pfull').value;
  if(!txt) return alert('Write story with KING: QUEEN: first!');
  stopAll();
  let voices=speechSynthesis.getVoices();
  let sel=document.getElementById('lang');
  let baseVoice=voices[sel.value]||voices[0];
  let lines=txt.split('\n');
  let idx=0;
  function speakNext(){
    if(idx>=lines.length) return;
    let line=lines[idx].trim();
    if(!line){idx++;speakNext();return;}
    let charMatch=line.match(/^([A-Z ]+):/);
    let vIndex=0;
    if(charMatch){
      let charName=charMatch[1].trim();
      let found=voiceNames.findIndex(n=>charName.includes(n.split(' ')[0]) || n.toUpperCase().includes(charName));
      if(found>=0) vIndex=found;
    }
    let ut=new SpeechSynthesisUtterance(line.replace(/^.*?:/,''));
    ut.voice=baseVoice;
    ut.pitch=voiceConfig[vIndex].p;
    ut.rate=voiceConfig[vIndex].r;
    ut.onend=()=>{idx++;speakNext();};
    document.getElementById('subtitleBox').textContent=line;
    speechSynthesis.speak(ut);
  }
  speakNext();
}
function pauseAll(){speechSynthesis.pause();}
function stopAll(){speechSynthesis.cancel();}
function test20(){
  let voices=speechSynthesis.getVoices();
  let sel=document.getElementById('lang');
  let base=voices[sel.value]||voices[0];
  let i=0;
  function next(){
    if(i>=voiceNames.length) return;
    let ut=new SpeechSynthesisUtterance("Hello I am "+voiceNames[i]);
    ut.voice=base; ut.pitch=voiceConfig[i].p; ut.rate=voiceConfig[i].r;
    ut.onend=()=>{i++; setTimeout(next,300);};
    setVoice(i);
    document.getElementById('subtitleBox').textContent=voiceNames[i];
    speechSynthesis.speak(ut);
  }
  stopAll(); next();
}
</script>
</body>
</html>
