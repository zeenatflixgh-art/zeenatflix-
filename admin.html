<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Zeenatflix</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px;margin:0}.h{background:linear-gradient(90deg,#ff1493,orange);padding:15px;border-radius:12px;text-align:center;font-weight:bold;font-size:20px}.card{background:#1e1e1e;padding:15px;border-radius:12px;margin:12px 0}input,textarea,select{width:100%;padding:12px;border-radius:8px;border:none;background:#2a2a2a;color:#fff;margin:8px 0;box-sizing:border-box}.btn{padding:12px 20px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;width:100%;margin:5px 0}.save{background:#ff1493;color:#fff}.play{background:#00ff9d;color:#000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sBtn{background:#2a2a2a;color:#fff;padding:10px;border-radius:8px;border:none;cursor:pointer}.login{text-align:center;margin-top:50px}</style></head><body><div id="login" class="login"><div class="h">👑 ZEENATFLIX ADMIN</div><div class="card"><input id="pwd" type="password" placeholder="Password"><button class="btn save" onclick="if(document.getElementById('pwd').value==='admin123'){localStorage.setItem('za','1');show()}else alert('Wrong! admin123')">Login</button><p style="color:#aaa">Password: admin123</p></div></div><div id="panel" style="display:none"><div class="h">👑 ADMIN - All Controls Here!</div><div class="card"><h3>📝 Add Story to Poster</h3><select id="sel"></select><input id="t" placeholder="Title e.g. MY STEPMOTHER'S DAUGHTER"><textarea id="s" rows="10" placeholder="Write full story here..."></textarea><button class="btn save" onclick="saveS()">💾 SAVE STORY</button></div><div class="card"><h3>🎙️ Voice Controls (Admin Only)</h3><select id="lang"><option value="en-GH">Ghana Twi</option><option value="en-NG">Pidgin</option><option value="yo-NG">Yoruba</option><option value="en-GB">UK</option><option value="en-US">US</option></select><div class="grid"><button class="btn play" onclick="spk()">▶️ PLAY</button><button class="btn" style="background:orange;color:#000" onclick="speechSynthesis.pause()">⏸️ PAUSE</button><button class="btn" style="background:#ff4757;color:#fff" onclick="speechSynthesis.cancel()">⏹️ STOP</button></div><div class="grid" style="margin-top:10px"><button class="sBtn">🎙️ Narrator</button><button class="sBtn">👑 King</button><button class="sBtn">👩 Queen Mother</button><button class="sBtn">🤴 Prince</button><button class="sBtn">👧 Amara</button><button class="sBtn">💂 Guard</button></div></div><div class="card"><h3>📊 Views / Likes / Comments</h3><div id="stats"></div><button class="btn" style="background:#2a2a2a;color:#fff" onclick="loadStats()">Refresh Stats</button></div><a href="index.html" style="display:block;text-align:center;color:#ff1493;margin:20px">⬅️ Home</a></div><script>const titles=["THE STOLEN BABY","MISSING BUT FOUND","SECRETS OF THE LETTER","THE SLAVE TRADE","THE ABANDONED HUTS","THE TWINS","AMARA","THE FOOD SELLER","THE WHITE MAN","THE RIVER BRIDE","THE GENEROUS HUNTER","MY STEPMOTHER'S DAUGHTER","THE HEADMASTER SECRET","FORGOTTEN PROMISE","THE MARKET GIRL","THE LIBRARY SECRET","DEATH OF NO RETURN","FOREST OF NO RETURN","SHATTERED VOWS"];function show(){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';let sel=document.getElementById('sel');sel.innerHTML="";titles.forEach((t,i)=>sel.innerHTML+=`<option value="static_${i}">${t}</option>`);let custom=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");custom.forEach(m=>sel.innerHTML+=`<option value="${m.id}">${m.title}</option>`);loadStats()}if(localStorage.getItem('za')==='1')show();function saveS(){let id=document.getElementById('sel').value;let story=document.getElementById('s').value;if(!story)return alert("Write story!");let map=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");map[id]=story;localStorage.setItem('zeenat_poster_stories',JSON.stringify(map));alert("Saved! Now open World > tap that poster > story will show!")}function loadStats(){let v=JSON.parse(localStorage.getItem('zeenat_views')||"{}");let l=JSON.parse(localStorage.getItem('zeenat_likes')||"{}");let c=JSON.parse(localStorage.getItem('zeenat_comments')||"{}");let h="";titles.forEach((t,i)=>{let id="static_"+i;h+=`${t}: 👁️${v[id]||0} ❤️${l[id]||0} 💬${(c[id]||[]).length}<br>`});document.getElementById('stats').innerHTML=h||"No stats yet"}function spk(){let txt=document.getElementById('s').value;if(!txt)return alert("Write story first!");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang=document.getElementById('lang').value;speechSynthesis.speak(u)}</script></body></html>
