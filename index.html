<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEENATFLIX GH - Ghana's Best Audio Stories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
.header{background:linear-gradient(90deg,#ff0080,#ff6b35);padding:15px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{margin:0;font-size:22px}
.nav{display:flex;justify-content:center;gap:10px;padding:12px;background:#111;position:sticky;top:66px;z-index:99}
.nav a{color:#fff;text-decoration:none;padding:7px 18px;border-radius:20px;background:#222;font-size:14px}
.nav a.active{background:#ff0080}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#1e1e1e;border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;height:200px;object-fit:cover;background:#222;display:block}
.card .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);background:rgba(255,0,128,.9);width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transition:.2s}
.card:hover .play{opacity:1}
.card .info{padding:8px}
.card .info h3{font-size:11px;color:#ff6b35;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.meta{display:flex;justify-content:space-between;font-size:10px;color:#aaa}
.meta span{display:flex;align-items:center;gap:3px}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:1000;display:none;overflow-y:auto;padding:20px}
#player .box{max-width:500px;margin:20px auto;background:#1a1a1a;border-radius:15px;padding:15px}
.close{float:right;font-size:24px;cursor:pointer}
.voiceBtn{padding:8px 12px;border-radius:20px;border:none;margin:5px;cursor:pointer;font-weight:bold}
.voiceBtn.active{background:#ff0080;color:#fff}
#storyText{background:#222;padding:12px;border-radius:8px;margin:10px 0;max-height:200px;overflow-y:auto;font-size:13px;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.like{background:#222;color:#fff}.like.liked{background:#ff0080}
.commentBox{margin-top:15px}
.commentBox input{width:100%;padding:10px;border-radius:8px;border:none;background:#2a2a2a;color:#fff;margin-top:8px}
.cmt{background:#222;padding:8px;border-radius:6px;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div class="header"><h1>👑 ZEENATFLIX GH</h1><p style="font-size:13px;margin-top:4px">Ghana's Best Audio Stories</p></div>
<div class="nav"><a href="index.html" class="active">🏠 Home</a><a href="world.html">🌍 World</a><a href="admin.html">👑 CEO</a></div>
<div class="grid" id="grid"></div>

<div id="player">
<div class="box">
<span class="close" onclick="closePlayer()">✖</span>
<img id="pImg" style="width:100%;height:220px;object-fit:cover;border-radius:10px">
<h2 id="pTitle" style="margin:10px 0;color:#ff6b35;font-size:16px"></h2>
<div style="text-align:center;margin:10px 0">
<button class="voiceBtn active" id="femaleBtn" onclick="setVoice('female')">👩 Female</button>
<button class="voiceBtn" id="maleBtn" onclick="setVoice('male')">👨 Male</button>
</div>
<div style="text-align:center">
<button onclick="playStory()" id="playBtn" style="background:#00ff88;color:#000;border:none;padding:12px 30px;border-radius:25px;font-weight:bold;font-size:16px;cursor:pointer">▶️ PLAY AUDIO</button>
<button onclick="stopStory()" style="background:#ff4444;color:#fff;border:none;padding:10px 20px;border-radius:20px;margin-left:8px">⏹ Stop</button>
</div>
<div id="storyText"></div>
<audio id="audioPlayer" controls style="width:100%;margin-top:10px;display:none"></audio>
<div class="actions">
<button class="like" id="likeBtn" onclick="likeMovie()">❤️ <span id="likeCount">0</span> Likes</button>
<button style="background:#222;color:#fff" onclick="shareMovie()">🔗 Share</button>
</div>
<div style="font-size:11px;color:#aaa;margin-top:8px">👁️ <span id="viewCount">0</span> views • 💬 <span id="commentCount">0</span> comments</div>
<div class="commentBox">
<h4>💬 Comments</h4>
<div id="commentList"></div>
<input id="commentInput" placeholder="Add comment..." onkeypress="if(event.key==='Enter')addComment()">
<button onclick="addComment()" style="background:#ff0080;color:#fff;border:none;padding:8px 15px;border-radius:20px;margin-top:6px;width:100%">Post Comment</button>
</div>
</div>
</div>

<script>
// YOUR 19 REAL POSTERS - NO APOSTROPHE - FIXED SPACE!
const defaultPosters = [
"AMARA.jpg",
"THE-LIBRARY-SECRET.jpg",
"THE-RIVER-BRIDE.jpg",
"THE-STOLEN-BABY.jpg",
"THE-WHITE-MAN.jpg",
"THE-ABANDONED-HUTS.jpg",
"THE-TWINS.jpg",
"MISSING-BUT-FOUND.jpg",
"SECRETS-OF-THE-LETTER.jpg",
"THE-GENEROUS-HUNTER.jpg",
"THE-FOOD-SELLER.jpg",
"THE-SLAVE-TRADE.jpg",
"THE-HEADMASTER-SECRET.jpg",
"FORGOTTEN-PROMISE.jpg",
"THE-MARKET-GIRL.jpg",
"MY-STEPMOTHERS-DAUGHTER.jpg",
"FOREST-OF-NO-RETURN.jpg",
"SHATTERED-VOW.jpg",
"DEATH-OF-NO-RETURN.jpg"
];

let currentMovie = null;
let currentVoice = 'female';
let voices = [];

function loadVoices(){
 voices = speechSynthesis.getVoices();
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function getAllMovies(){
 let custom = JSON.parse(localStorage.getItem('customMovies')||'[]');
 let defaults = defaultPosters.map(p=>{
   let title = p.replace('.jpg','').replace(/-/g,' ');
   return {id:'default-'+p, title:title, image:'./posters/'+p, story:`Welcome to ${title}. This is a powerful Ghanaian story about ${title.toLowerCase()}. Listen to the full audio story with emotional narration. This story will teach you a lesson about life, love, and family.`, isDefault:true, file:p}
 });
 return [...custom, ...defaults];
}

function render(){
 const grid = document.getElementById('grid');
 const movies = getAllMovies();
 grid.innerHTML = movies.map(m=>{
   let views = localStorage.getItem('views_'+m.id)||Math.floor(Math.random()*900+100);
   let likes = localStorage.getItem('likes_'+m.id)||Math.floor(Math.random()*80+5);
   return `<div class="card" onclick="openPlayer('${m.id}')">
   <img src="${m.image}" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x400/1a1a1a/ff6b35?text=${encodeURIComponent(m.title)}'">
   <div class="play">▶️</div>
   <div class="info"><h3>${m.title}</h3><div class="meta"><span>👁️ ${views}</span><span>❤️ ${likes}</span><span>💬 ${ (JSON.parse(localStorage.getItem('comments_'+m.id)||'[]')).length }</span></div></div>
   </div>`;
 }).join('');
}
render();

function openPlayer(id){
 const movies = getAllMovies();
 currentMovie = movies.find(x=>x.id===id);
 if(!currentMovie) return;
 document.getElementById('pImg').src = currentMovie.image;
 document.getElementById('pTitle').innerText = currentMovie.title;
 document.getElementById('storyText').innerText = currentMovie.story || 'Full story loading...';
 document.getElementById('player').style.display='block';
 // Views
 let v = parseInt(localStorage.getItem('views_'+id)||'0')+1;
 localStorage.setItem('views_'+id, v);
 document.getElementById('viewCount').innerText = v;
 let likes = localStorage.getItem('likes_'+id)||'0';
 document.getElementById('likeCount').innerText = likes;
 if(localStorage.getItem('liked_'+id)) document.getElementById('likeBtn').classList.add('liked');
 else document.getElementById('likeBtn').classList.remove('liked');
 loadComments();
 // Audio if custom
 if(currentMovie.audio){
   let ap = document.getElementById('audioPlayer');
   ap.src = currentMovie.audio; ap.style.display='block';
 } else {
   document.getElementById('audioPlayer').style.display='none';
 }
}
function closePlayer(){ document.getElementById('player').style.display='none'; speechSynthesis.cancel(); }

function setVoice(v){
 currentVoice = v;
 document.getElementById('femaleBtn').classList.toggle('active', v==='female');
 document.getElementById('maleBtn').classList.toggle('active', v==='male');
}
function playStory(){
 speechSynthesis.cancel();
 let text = document.getElementById('storyText').innerText;
 let utter = new SpeechSynthesisUtterance(text);
 let allVoices = speechSynthesis.getVoices();
 if(currentVoice==='female'){
   utter.voice = allVoices.find(x=>x.name.toLowerCase().includes('female')||x.name.includes('Zira')||x.name.includes('Google UK English Female'))||allVoices[0];
   utter.pitch = 1.1;
 } else {
   utter.voice = allVoices.find(x=>x.name.toLowerCase().includes('male')||x.name.includes('David')||x.name.includes('Google UK English Male'))||allVoices[1]||allVoices[0];
   utter.pitch = 0.9;
 }
 utter.rate = 0.9;
 speechSynthesis.speak(utter);
 document.getElementById('playBtn').innerText='⏸️ Playing...';
 utter.onend = ()=>{document.getElementById('playBtn').innerText='▶️ PLAY AUDIO';}
}
function stopStory(){ speechSynthesis.cancel(); document.getElementById('playBtn').innerText='▶️ PLAY AUDIO'; }

function likeMovie(){
 if(!currentMovie) return;
 if(localStorage.getItem('liked_'+currentMovie.id)){
   let c = parseInt(localStorage.getItem('likes_'+currentMovie.id)||'1')-1;
   localStorage.setItem('likes_'+currentMovie.id, c);
   localStorage.removeItem('liked_'+currentMovie.id);
   document.getElementById('likeBtn').classList.remove('liked');
   document.getElementById('likeCount').innerText = c;
 } else {
   let c = parseInt(localStorage.getItem('likes_'+currentMovie.id)||'0')+1;
   localStorage.setItem('likes_'+currentMovie.id, c);
   localStorage.setItem('liked_'+currentMovie.id,'1');
   document.getElementById('likeBtn').classList.add('liked');
   document.getElementById('likeCount').innerText = c;
 }
 render();
}
function loadComments(){
 if(!currentMovie) return;
 let cmts = JSON.parse(localStorage.getItem('comments_'+currentMovie.id)||'[]');
 document.getElementById('commentList').innerHTML = cmts.map(c=>`<div class="cmt"><b>${c.name}:</b> ${c.text}</div>`).join('') || '<div style="color:#666;font-size:11px">No comments yet. Be first!</div>';
 document.getElementById('commentCount').innerText = cmts.length;
}
function addComment(){
 let input = document.getElementById('commentInput');
 if(!input.value.trim()) return;
 let cmts = JSON.parse(localStorage.getItem('comments_'+currentMovie.id)||'[]');
 cmts.push({name:'Viewer', text:input.value, time:Date.now()});
 localStorage.setItem('comments_'+currentMovie.id, JSON.stringify(cmts));
 input.value=''; loadComments(); render();
}
function shareMovie(){
 if(navigator.share){navigator.share({title:currentMovie.title, url:location.href})} else {navigator.clipboard.writeText(location.href); alert('Link copied CEO!');}
}
</script>
</body>
  </html>
