<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEENATFLIX - Ghana Stories | Amara | Keleshi | Azimatu</title>
<meta name="description" content="ZEENATFLIX - Watch Amara, Keleshi, The Stolen Baby, Market Girl - Best Ghana African stories by Azimatu">
<meta name="keywords" content="Ghana stories, Amara, Keleshi, Zeenatflix, African stories, Azimatu">
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:10px}
.header{background:linear-gradient(90deg,#ff1493,orange);padding:15px;border-radius:15px;text-align:center;position:sticky;top:0;z-index:10}
.header a{color:#fff;text-decoration:none;font-weight:bold;background:rgba(0,0,0,0.3);padding:6px 12px;border-radius:20px;margin:2px;display:inline-block}
.searchBox{width:100%;padding:14px;border-radius:25px;border:none;background:#1e1e1e;color:#fff;margin:10px 0;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1e1e1e;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:250px;object-fit:cover;background:#222;display:block}
.info{padding:10px}
.info h3{margin:5px 0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:8px;left:8px;background:#00ff9d;color:#000;font-size:9px;padding:3px 7px;border-radius:10px;font-weight:bold}
.wrap{position:relative}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">🎬 ZEENATFLIX</h2>
<a href="world.html">🌍 World</a> <a href="admin.html">👑 Admin</a>
<div style="font-size:11px;margin-top:5px" id="totalMovies">Loading...</div>
</div>
<input id="searchBox" class="searchBox" onkeyup="renderMovies(this.value)" placeholder="🔍 Search stories: Amara, Keleshi, Twins, Baby...">
<div class="grid" id="movieGrid"></div>
<script>
const staticPosters=[
{title:"THE STOLEN BABY",img:"THE-STOLEN-BABY.jpg",desc:"She Sold Her Baby For Money",views:"6.1M"},
{title:"MISSING BUT FOUND",img:"MISSING-BUT-FOUND.jpg",desc:"Lost in Accra market",views:"5.6M"},
{title:"SECRETS OF THE LETTER",img:"SECRETS-OF-THE-LETTER.jpg",desc:"Letter opened after 20 years",views:"4.2M"},
{title:"THE SLAVE TRADE",img:"THE-SLAVE-TRADE.jpg",desc:"Slave trade history",views:"4.0M"},
{title:"THE ABANDONED HUTS",img:"THE-ABANDONED-HUTS.jpg",desc:"Vanishing of Maame Serwaa",views:"3.3M"},
{title:"THE TWINS",img:"THE-TWINS.jpg",desc:"The twins secret",views:"3.1M"},
{title:"AMARA",img:"AMARA.jpg",desc:"Village girl who became queen",views:"3.0M"},
{title:"THE FOOD SELLER",img:"THE-FOOD-SELLER.jpg",desc:"Monica's Secret",views:"2.8M"},
{title:"THE WHITE MAN",img:"THE-WHITE-MAN.jpg",desc:"The white man story",views:"2.7M"},
{title:"THE RIVER BRIDE",img:"THE-RIVER-BRIDE.jpg",desc:"River bride mystery",views:"2.5M"},
{title:"THE GENEROUS HUNTER",img:"THE-GENEROUS-HUNTER.jpg",desc:"Generous hunter tale",views:"2.3M"},
{title:"MY STEPMOTHER'S DAUGHTER",img:"STEPMOTHER.jpg",desc:"Tried to steal my destiny",views:"2.2M"},
{title:"THE HEADMASTER SECRET",img:"THE-HEADMASTER-SECRET.jpg",desc:"Headmaster secret",views:"2.1M"},
{title:"FORGOTTEN PROMISE",img:"FORGOTTEN-PROMISE.jpg",desc:"Forgotten promise",views:"2.0M"},
{title:"THE MARKET GIRL",img:"THE-MARKET-GIRL.jpg",desc:"Market girl story",views:"1.9M"},
{title:"THE LIBRARY SECRET",img:"THE-LIBRARY-SECRET.jpg",desc:"Library secret",views:"1.8M"},
{title:"DEATH OF NO RETURN",img:"DEATH-OF-NO-RETURN.jpg",desc:"Death of no return",views:"3.5M"},
{title:"FOREST OF NO RETURN",img:"FOREST-OF-NO-RETURN.jpg",desc:"Forest of no return",views:"2.9M"},
{title:"SHATTERED VOWS",img:"SHATTERED-VOWS.jpg",desc:"Broke his vow on wedding night",views:"1.1M"}
];
function getPostedMovies(){return JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");}
function getPosterStories(){return JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");}
function renderMovies(filter=""){
 let grid=document.getElementById('movieGrid');grid.innerHTML="";
 let posted=getPostedMovies();let posterStories=getPosterStories();
 let all=[];
 posted.forEach(m=>all.push({id:m.id,title:m.title,img:m.image,desc:m.subtitle||"Your story",views:m.views||"NEW",isPosted:true}));
 staticPosters.forEach((s,i)=>all.push({id:"static_"+i,title:s.title,img:s.img,desc:s.desc,views:s.views,isPosted:false}));
 if(filter) all=all.filter(m=>m.title.toLowerCase().includes(filter.toLowerCase())||m.desc.toLowerCase().includes(filter.toLowerCase()));
 document.getElementById('totalMovies').innerText=all.length+" Stories Found - Type to search Amara...";
 all.forEach(m=>{
  let hasStory=m.isPosted||posterStories[m.id]?"✅ ":"";
  let div=document.createElement('div');div.className='card';
  div.innerHTML=`<div class="wrap"><div class="badge" style="background:${m.isPosted?'#00ff9d':'#ff1493'};color:${m.isPosted?'#000':'#fff'}">${hasStory}${m.isPosted?'YOUR POST':'WORLD'}</div><img src="${m.img}" onerror="this.src='https://via.placeholder.com/300x400/1e1e1e/00ff9d?text=${encodeURIComponent(m.title)}'"></div><div class="info"><h3>${m.title}</h3><p style="font-size:11px;color:#aaa">${m.desc}</p><p style="font-size:10px">👁️ ${m.views}</p></div>`;
  div.onclick=()=>location.href='story.html?id='+m.id;
  grid.appendChild(div);
 });
}
renderMovies();
</script>
</body>
</html>
