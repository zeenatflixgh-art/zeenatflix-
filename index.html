<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeenatflix GH - Videos + Audios + Stories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9;border-bottom:2px solid #e50914}
.logo{color:#e50914;font-weight:bold;font-size:22px;text-decoration:none}
nav a{color:#fff;text-decoration:none;margin-left:10px;font-size:14px}
.hero{background:linear-gradient(rgba(0,0,0,.6),#000),url('https://images.unsplash.com/photo-1485846234645-a62644f84728?w=1200');background-size:cover;padding:50px 15px;text-align:center}
.hero h1{font-size:32px;color:#e50914}.hero p{margin:10px auto;max-width:600px;color:#ccc}
.btn{background:#e50914;color:#fff;padding:12px 22px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;margin:6px}
.btn2{background:#222;border:1px solid #444}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;max-width:1000px;margin:auto}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#111;border-radius:12px;overflow:hidden;border:1px solid #222;cursor:pointer;transition:.2s}
.card:hover{transform:scale(1.03);border-color:#e50914}
.card img{width:100%;height:170px;object-fit:cover}
.card .info{padding:10px}.tag{font-size:11px;color:#e50914}.title{font-weight:bold;margin:4px 0;font-size:14px}
.badge{display:inline-block;background:#e50914;font-size:10px;padding:2px 6px;border-radius:10px;margin-right:3px}
.audio-badge{background:#1db954}
footer{text-align:center;padding:30px;color:#666;font-size:13px;border-top:1px solid #111;margin-top:20px}
</style></head><body>
<header><a class="logo" href="index.html">ZEENATFLIX GH</a><nav><a href="world.html">🌍 World</a><a href="admin.html">👑 CEO</a></nav></header>

<div class="hero">
<h1>🎬 Videos + 🎧 Audios + 📖 Stories</h1>
<p>Ghana's No.1 drama platform - Watch, Listen & Read Anytime!</p>
<a class="btn" href="#videos">▶️ Watch Now</a>
<a class="btn btn2" href="world.html">🌍 Explore World</a>
</div>

<div style="text-align:center;padding:15px"><h2 id="videos">🔥 Trending Now</h2><p style="color:#888">Tap any story - Video & Audio inside!</p></div>
<div class="grid" id="grid"></div>

<footer>© 2026 Zeenatflix GH - Kumasi, Ghana<br>Videos + Audios + Stories | CEO: Zeenat</footer>

<script>
const stories=[
{id:1,title:"AMARA",tag:"Housegirl to KNUST Graduate",img:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=600",type:"Video"},
{id:2,title:"SHATTERED VOWS",tag:"He married her own sister",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600",type:"Video"},
{id:3,title:"THE PAIN OF AKOSUA",tag:"Love & Betrayal in Accra",img:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600",type:"Audio"},
{id:4,title:"MONEY OR LOVE",tag:"Kumasi Millionaire Story",img:"https://images.unsplash.com/photo-1534751516642-a1af1ef26a56?w=600",type:"Video"},
];
for(let i=5;i<=20;i++){stories.push({id:i,title:"GHANA STORY "+i,tag:"Drama Series "+i,img:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600",type:i%2?"Video":"Audio"})}
document.getElementById('grid').innerHTML=stories.map(s=>`
<div class="card" onclick="openStory(${s.id})">
<img src="${s.img}" loading="lazy">
<div class="info">
<span class="badge">${s.type==="Video"?"🎥 VIDEO":"🎧 AUDIO"}</span>
<div class="title">${s.title}</div>
<div class="tag">${s.tag}</div>
</div>
</div>`).join('');
function openStory(id){localStorage.setItem('zeenat_current',id);location.href='story.html?id='+id;}
</script>
</body></html>
