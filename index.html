<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZEENATFLIX GH</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding-bottom:60px}
h1{color:#ff0055;margin:20px}
.search{width:85%;padding:14px;border-radius:25px;border:none;margin:10px}
.card{background:#111;margin:8px;border-radius:15px;padding:10px;display:inline-block;width:160px;vertical-align:top}
.card img{width:100%;height:220px;border-radius:10px;object-fit:cover}
.card h4{font-size:12px;margin:6px 0;height:28px}
.info{font-size:11px;color:#aaa;line-height:16px}
.views{color:#0f0} .likes{color:#ff4081} .comms{color:#00d4ff}
.world-btn{background:#00ff88;color:#000;padding:15px 30px;border-radius:25px;text-decoration:none;display:inline-block;margin:20px;font-weight:bold}
</style>
</head>
<body>
<h1>🔥 ZEENATFLIX GH 🇬🇭</h1>
<input class="search" placeholder="🔍 Search..." id="s" onkeyup="filter()">
<br><a href="world.html" class="world-btn">🌍 World Trending - Go Global!</a>
<div id="movies"></div>
<script>
let data=[
{f:"AMARA.jpg",v:"2.4M",l:"184K",c:"12.5K"},
{f:"DEATH-OF-NO-RETURN.jpg",v:"1.8M",l:"98K",c:"8.2K"},
{f:"FOREST-OF-NO-RETURN.jpg",v:"3.1M",l:"210K",c:"19K"},
{f:"FORGOTTEN-PROMISE.jpg",v:"892K",l:"45K",c:"3.1K"},
{f:"MISSING-BUT-FOUND.jpg",v:"1.5M",l:"76K",c:"6.7K"},
{f:"MY-STEPMOTHERS-DAUGHTER.jpg",v:"2.7M",l:"165K",c:"14K"},
{f:"SECRETS-OF-THE-LETTER.jpg",v:"1.1M",l:"52K",c:"4.3K"},
{f:"SHATTERED-VOWS.jpg",v:"4.2M",l:"320K",c:"28K"},
{f:"THE-ABANDONED-HUTS.jpg",v:"987K",l:"41K",c:"2.9K"},
{f:"THE-FOOD-SELLER.jpg",v:"1.3M",l:"68K",c:"5.5K"},
{f:"THE-GENEROUS-HUNTER.jpg",v:"756K",l:"33K",c:"2.1K"},
{f:"THE-HEADMASTER-SECRET.jpg",v:"2.1M",l:"112K",c:"9.8K"},
{f:"THE-LIBRARY-SECRET.jpg",v:"1.6M",l:"88K",c:"7.2K"},
{f:"THE-MARKET-GIRL.jpg",v:"3.5M",l:"245K",c:"22K"},
{f:"THE-RIVER-BRIDE.jpg",v:"2.9M",l:"178K",c:"15K"},
{f:"THE-SLAVE-TRADE.jpg",v:"5.1M",l:"410K",c:"35K"},
{f:"THE-STOLEN-BABY.jpg",v:"4.8M",l:"385K",c:"31K"},
{f:"THE-TWINS.jpg",v:"3.9M",l:"298K",c:"26K"},
{f:"THE-WHITE-MAN.jpg",v:"6.2M",l:"512K",c:"42K"}
];
let box=document.getElementById("movies");
function show(list){
box.innerHTML="";
list.forEach(o=>{
let t=o.f.replace(".jpg","").replace(/-/g," ");
box.innerHTML+=`<div class="card"><a href="story.html?title=${encodeURIComponent(t)}&img=${encodeURIComponent(o.f)}&views=${o.v}&likes=${o.l}&comments=${o.c}" style="text-decoration:none;color:#fff"><img src="${o.f}"><h4>${t}</h4><div class="info"><span class="views">👁️ ${o.v} views</span><br><span class="likes">❤️ ${o.l} likes</span> • <span class="comms">💬 ${o.c} comments</span><br>⭐ 4.9</div></a></div>`;
});
}
show(data);
function filter(){
let q=document.getElementById("s").value.toLowerCase();
show(data.filter(o=>o.f.toLowerCase().includes(q)));
}
</script>
</body>
</html>
