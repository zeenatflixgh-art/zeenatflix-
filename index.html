<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEENATFLIX</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.header{background:linear-gradient(90deg,#ff0080,#ff8a00);padding:18px 15px;text-align:center;border-radius:16px;margin:8px}
.header h1{margin:0;font-size:30px;font-weight:900}
.header p{margin:5px 0 0;font-size:14px;opacity:0.95}
.searchWrap{padding:10px 12px;position:sticky;top:0;z-index:99;background:#0a0a0a}
#search{width:100%;padding:14px 18px;border-radius:25px;border:none;background:#fff;color:#000;font-size:15px;box-sizing:border-box}
.worldBtn{display:block;margin:10px auto;background:#00ff88;color:#000;padding:12px;text-align:center;border-radius:25px;font-weight:900;text-decoration:none;width:85%;max-width:320px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#151515;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #222;position:relative}
.card img{width:100%;height:270px;object-fit:cover;display:block}
.locked img{filter:brightness(0.7)}
.lock-badge{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.65);width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #ffcc00}
.open-badge{position:absolute;top:8px;right:8px;background:#00ff88;color:#000;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:900}
.info{padding:10px 10px 8px}
.info h3{margin:0;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{font-size:11px;color:#aaa;margin-top:4px;line-height:1.5}
.views{color:#00ff88}.likes{color:#ff3366}.comments{color:#66ccff}.star{color:#ffcc00}
</style>
</head><body>
<div class="header"><h1>🎬 ZEENATFLIX</h1><p>19 Ghana Movies - Tap to Listen!</p></div>
<div class="searchWrap"><input id="search" placeholder="🔍 Search..." onkeyup="render()"></div>
<a class="worldBtn" href="world.html">🌍 World Trending - Go Global!</a>
<div class="grid" id="grid"></div>
<script>
const posters=[
{id:"static_0",t:"THE STOLEN BABY",i:"THE-STOLEN-BABY.jpg",v:"3.1M",l:"210K",c:"15K",s:"5.0"},
{id:"static_1",t:"MISSING BUT FOUND",i:"MISSING-BUT-FOUND.jpg",v:"2.0M",l:"120K",c:"9K",s:"4.8"},
{id:"static_2",t:"SECRETS OF THE LETTER",i:"SECRETS-OF-THE-LETTER.jpg",v:"1.5M",l:"88K",c:"7K",s:"4.7"},
{id:"static_3",t:"THE SLAVE TRADE",i:"THE-SLAVE-TRADE.jpg",v:"2.8M",l:"150K",c:"11K",s:"4.9"},
{id:"static_4",t:"THE ABANDONED HUTS",i:"THE-ABANDONED-HUTS.jpg",v:"1.2M",l:"65K",c:"5K",s:"4.6"},
{id:"static_5",t:"THE TWINS",i:"THE-TWINS.jpg",v:"1.9M",l:"105K",c:"8.5K",s:"4.8"},
{id:"static_6",t:"AMARA",i:"AMARA.jpg",v:"3.2M",l:"782K",c:"12.5K",s:"4.9"},
{id:"static_7",t:"THE FOOD SELLER",i:"THE-FOOD-SELLER.jpg",v:"2.2M",l:"130K",c:"10K",s:"4.9"},
{id:"static_8",t:"THE WHITE MAN",i:"THE-WHITE-MAN.jpg",v:"1.1M",l:"55K",c:"4K",s:"4.5"},
{id:"static_9",t:"THE RIVER BRIDE",i:"THE-RIVER-BRIDE.jpg",v:"2.5M",l:"600K",c:"6K",s:"4.7"},
{id:"static_10",t:"THE GENEROUS HUNTER",i:"THE-GENEROUS-HUNTER.jpg",v:"1.6M",l:"90K",c:"7.5K",s:"4.8"},
{id:"static_11",t:"MY STEPMOTHER'S DAUGHTER",i:"MY-STEPMOTHER.jpg",v:"2.5M",l:"160K",c:"12K",s:"4.9"},
{id:"static_12",t:"THE HEADMASTER SECRET",i:"THE-HEADMASTER-SECRET.jpg",v:"1.4M",l:"75K",c:"6.5K",s:"4.6"},
{id:"static_13",t:"FORGOTTEN PROMISE",i:"FORGOTTEN-PROMISE.jpg",v:"1.7M",l:"95K",c:"8K",s:"4.8"},
{id:"static_14",t:"THE MARKET GIRL",i:"THE-MARKET-GIRL.jpg",v:"2.0M",l:"110K",c:"9.2K",s:"4.8"},
{id:"static_15",t:"THE LIBRARY SECRET",i:"THE-LIBRARY-SECRET.jpg",v:"2.8M",l:"957K",c:"3K",s:"4.4"},
{id:"static_16",t:"DEATH OF NO RETURN",i:"DEATH-OF-NO-RETURN.jpg",v:"1.8M",l:"98K",c:"8.2K",s:"4.9"},
{id:"static_17",t:"FOREST OF NO RETURN",i:"FOREST-OF-NO-RETURN.jpg",v:"1.0M",l:"60K",c:"4.5K",s:"4.5"},
{id:"static_18",t:"SHATTERED VOWS",i:"SHATTERED-VOWS.jpg",v:"2.3M",l:"140K",c:"11K",s:"4.9"}
];
function checkAndOpen(id){
 let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");
 let custom=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]").find(m=>m.id==id);
 if(!stories[id]&&!custom){alert("🔒 Coming Soon! This story is locked. Post story in Admin to unlock!");return;}
 location.href='story.html?id='+id;
}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");
 let customMovies=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");
 let all=[...posters];
 customMovies.forEach(cm=>{if(!all.find(p=>p.id==cm.id)){all.unshift({id:cm.id,t:cm.title,i:cm.image,v:"NEW",l:"0",c:"0",s:"5.0"});}});
 let html="";
 all.forEach(p=>{
  if(!p.t.toLowerCase().includes(q)) return;
  let has=stories[p.id]||customMovies.find(m=>m.id==p.id);
  let imgData=localStorage.getItem('zeenat_poster_img_'+p.id);let src=imgData||p.i;
  let badge=!has?`<div class="lock-badge">🔒</div>`:`<div class="open-badge">🔓 OPEN</div>`;
  html+=`<div class="card ${!has?'locked':''}" onclick="checkAndOpen('${p.id}')">
  <img src="${src}" onerror="this.src='https://via.placeholder.com/300x400?text=${encodeURIComponent(p.t)}'">
  ${badge}
  <div class="info"><h3>${p.t}</h3>
  <div class="stats"><span class="views">👁️ ${p.v}</span> • <span class="likes">❤️ ${p.l}</span><br><span class="comments">💬 ${p.c}</span> • <span class="star">⭐ ${p.s}</span> • Ghana</div>
  </div></div>`;
 });
 document.getElementById('grid').innerHTML=html;
}
render();
</script></body></html>
