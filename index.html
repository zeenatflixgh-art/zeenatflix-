<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEENATFLIX GH - Ghana's Best Audio Stories</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:'Segoe UI',Arial,sans-serif}
.header{background:linear-gradient(90deg,#ff0080,#ff4d00,#ff8a00);padding:18px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(255,0,128,.4)}
.header h1{font-size:24px;letter-spacing:1px}
.header p{font-size:13px;opacity:.9;margin-top:3px}
.nav{display:flex;justify-content:center;gap:10px;padding:12px;background:#111;border-bottom:1px solid #222;position:sticky;top:71px;z-index:99}
.nav a{color:#ccc;text-decoration:none;padding:8px 18px;border-radius:25px;background:#1e1e1e;font-size:14px;font-weight:600;transition:.2s}
.nav a.active{background:linear-gradient(90deg,#ff0080,#ff6b35);color:#fff;box-shadow:0 3px 10px rgba(255,0,128,.4)}
.search{padding:12px}
.search input{width:100%;padding:12px 15px;border-radius:25px;border:none;background:#1e1e1e;color:#fff;font-size:14px}
.trend{background:linear-gradient(90deg,#1a1a1a,#222);margin:12px;padding:12px;border-radius:10px;border-left:4px solid #ff0080}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#161616;border-radius:14px;overflow:hidden;cursor:pointer;transition:.3s;border:1px solid #222;position:relative}
.card:hover{transform:translateY(-4px);border-color:#ff0080;box-shadow:0 8px 25px rgba(255,0,128,.2)}
.card img{width:100%;height:285px;object-fit:cover;display:block;background:#111}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.8);color:#00ff88;font-size:9px;padding:4px 8px;border-radius:12px;font-weight:bold}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(90deg,#ff0080,#ff6b35);width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;transition:.3s;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.card:hover.play{opacity:1}
.info{padding:10px}
.info h3{font-size:12px;color:#ff8a00;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.info p{font-size:11px;color:#aaa;line-height:1.3;height:28px;overflow:hidden}
.meta{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:#666}
.meta b{color:#ff6b35}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.96);z-index:1000;display:none;overflow-y:auto}
.pBox{max-width:520px;margin:15px auto;background:#151515;border-radius:16px;overflow:hidden;border:1px solid #222}
.pTop img{width:100%;height:300px;object-fit:cover}
.pBody{padding:15px}
.voice{display:flex;gap:8px;justify-content:center;margin:12px 0}
.voice button{padding:9px 18px;border-radius:20px;border:none;font-weight:bold;cursor:pointer}
.vActive{background:#ff0080;color:#fff}.vOff{background:#2a2a2a;color:#ccc}
.btnPlay{background:linear-gradient(90deg,#00ff88,#00cc6a);color:#000;border:none;padding:13px 30px;border-radius:30px;font-weight:bold;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>👑 ZEENATFLIX GH</h1><p>Ghana's Best Audio Stories - Listen & Feel</p></div>
<div class="nav"><a href="index.html" class="active">🏠 Home</a><a href="world.html">🌍 World</a><a href="admin.html">👑 CEO</a></div>
<div class="search"><input id="search" placeholder="🔍 Search story... e.g. STOLEN BABY" oninput="filterSearch()"></div>
<div class="trend">🔥 <b>Trending Now:</b> THE STOLEN BABY - 5.1M views • MISSING BUT FOUND - 5.6M views</div>
<div class="grid" id="grid">Loading your 19 stories...</div>

<div id="player">
<div class="pBox">
<div class="pTop"><img id="pImg"><div style="padding:10px"><span style="float:right;font-size:22px;cursor:pointer" onclick="closeP()">✖</span><h2 id="pTitle" style="color:#ff6b35;font-size:18px"></h2><p id="pDesc" style="color:#aaa;font-size:12px;margin-top:4px"></p></div></div>
<div class="pBody">
<div class="voice"><button id="fBtn" class="vActive" onclick="setV('female')">👩 Female Voice</button><button id="mBtn" class="vOff" onclick="setV('male')">👨 Male Voice</button></div>
<div style="text-align:center"><button class="btnPlay" id="playBtn" onclick="playS()">▶️ PLAY AUDIO STORY</button><button onclick="stopS()" style="background:#333;color:#fff;border:none;padding:10px 16px;border-radius:20px;margin-left:6px">⏹️ Stop</button></div>
<div id="pStory" style="background:#1e1e1e;padding:12px;border-radius:10px;margin-top:12px;font-size:13px;line-height:1.6;max-height:180px;overflow-y:auto"></div>
<audio id="audio" controls style="width:100%;margin-top:10px;display:none"></audio>
<div style="display:flex;gap:8px;margin-top:12px"><button id="likeBtn" onclick="like()" style="flex:1;background:#1e1e1e;color:#fff;border:none;padding:10px;border-radius:10px">❤️ <span id="likeC">0</span> Likes</button><button onclick="share()" style="flex:1;background:#1e1e1e;color:#fff;border:none;padding:10px;border-radius:10px">🔗 Share</button></div>
<div style="margin-top:10px;font-size:11px;color:#666">👁️ <span id="viewC">0</span> views • <span id="cmtC">0</span> comments</div>
<div id="cmtList" style="margin-top:10px"></div>
<input id="cmtIn" placeholder="💬 Add a comment..." style="width:100%;padding:10px;border-radius:20px;border:none;background:#1e1e1e;color:#fff;margin-top:8px" onkeypress="if(event.key==='Enter')addC()">
</div>
</div>
</div>

<script>
const PRO_POSTERS = [
{file:"AMARA.jpg",title:"AMARA",desc:"A girl sold for rituals but fights back - Ghana power! A story of survival...",views:"2.7M"},
{file:"THE-LIBRARY-SECRET.jpg",title:"THE LIBRARY SECRET",desc:"The secret hidden in the library will shock the whole school!...",views:"3.1M"},
{file:"THE-RIVER-BRIDE.jpg",title:"THE RIVER BRIDE",desc:"She married the river god to save her village - what happened next?",views:"2.9M"},
{file:"THE-STOLEN-BABY.jpg",title:"THE STOLEN BABY",desc:"Her baby was stolen at birth - 20 years search for truth!...",views:"5.1M"},
{file:"THE-WHITE-MAN.jpg",title:"THE WHITE MAN",desc:"The white man came with a promise - but at what cost to the village?",views:"1.8M"},
{file:"THE-ABANDONED-HUTS.jpg",title:"THE ABANDONED HUTS",desc:"The Vanishing of Maame Serwaa in the cursed huts...",views:"3.3M"},
{file:"THE-TWINS.jpg",title:"THE TWINS",desc:"Twin sisters separated by juju - will destiny bring them together?",views:"4.0M"},
{file:"MISSING-BUT-FOUND.jpg",title:"MISSING BUT FOUND",desc:"Lost 7 Years, Found Selling Pure Water in Accra...",views:"5.6M"},
{file:"SECRETS-OF-THE-LETTER.jpg",title:"SECRETS OF THE LETTER",desc:"A letter opened after 20 years changed everything in the family!...",views:"4.2M"},
{file:"THE-GENEROUS-HUNTER.jpg",title:"THE GENEROUS HUNTER",desc:"He gave everything to the village but got betrayal in return...",views:"3.5M"},
{file:"THE-FOOD-SELLER.jpg",title:"THE FOOD SELLER",desc:"Monica's special food hid a dangerous secret that killed men!...",views:"4.8M"},
{file:"THE-SLAVE-TRADE.jpg",title:"THE SLAVE TRADE",desc:"The child slave girl who became queen - powerful story!...",views:"3.9M"},
{file:"THE-HEADMASTER-SECRET.jpg",title:"THE HEADMASTER SECRET",desc:"Headmaster's secret affair with a student exposed!...",views:"2.5M"},
{file:"FORGOTTEN-PROMISE.jpg",title:"FORGOTTEN PROMISE",desc:"She waited 10 years for his promise - he returned with another woman!...",views:"5.4M"},
{file:"THE-MARKET-GIRL.jpg",title:"THE MARKET GIRL",desc:"Market girl who fed the whole village with her kindness...",views:"2.2M"},
{file:"MY-STEPMOTHERS-DAUGHTER.jpg",title:"MY STEPMOTHER'S DAUGHTER",desc:"My stepmother's daughter tried to steal my destiny and husband!...",views:"2.2M"},
{file:"FOREST-OF-NO-RETURN.jpg",title:"FOREST OF NO RETURN",desc:"The forest that swallows men - will he escape the curse?...",views:"5.9M"},
{file:"SHATTERED-VOW.jpg",title:"SHATTERED VOW",desc:"He broke his vow on wedding night - she took revenge!...",views:"1.1M"},
{file:"DEATH-OF-NO-RETURN.jpg",title:"DEATH OF NO RETURN",desc:"He returned from death to warn his family of danger!...",views:"4.4M"}
];
let cur=null; let voiceType='female';
function getAll(){ let c=JSON.parse(localStorage.getItem('customMovies')||'[]'); return [...c,...PRO_POSTERS.map(p=>({id:'pro-'+p.file,title:p.title,desc:p.desc,views:p.views,file:p.file,image:'https://zeenatflixgh-art.github.io/zeenatflix-/posters/'+encodeURIComponent(p.file),story:p.title+' - '+p.desc+' This is a full emotional Ghanaian audio story about '+p.title.toLowerCase()+'. Listen till the end, you will learn a great lesson about life, love, forgiveness and family. The story is deep and will make you cry and laugh. Thank you for listening to Zeenatflix GH.',isPro:true}))]; }
function render(list){ if(!list) list=getAll(); let g=document.getElementById('grid'); g.innerHTML=list.map(m=>{ let likes=localStorage.getItem('likes_'+m.id)||Math.floor(Math.random()*80+20); let cmts=JSON.parse(localStorage.getItem('comments_'+m.id)||'[]').length; return `<div class="card" onclick="openM('${m.id}')"><div class="badge">🌍 World Exclusive</div><img src="${m.image}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x500/111/ff0080?text=${encodeURIComponent(m.title)}'"><div class="play">▶️</div><div class="info"><h3>${m.title}</h3><p>${m.desc||m.subtitle||'Ghana power story - listen now!'}</p><div class="meta"><span>👁️ <b>${m.views||'1.2M'}</b></span><span>❤️ ${likes}</span><span>💬 ${cmts}</span></div></div></div>`; }).join(''); }
render();
function filterSearch(){ let q=document.getElementById('search').value.toLowerCase(); let all=getAll(); let f=all.filter(m=>m.title.toLowerCase().includes(q)); render(f); }
function openM(id){ let all=getAll(); cur=all.find(x=>x.id===id); if(!cur)return; document.getElementById('pImg').src=cur.image; document.getElementById('pTitle').innerText=cur.title; document.getElementById('pDesc').innerText=cur.desc||''; document.getElementById('pStory').innerText=cur.story; document.getElementById('player').style.display='block'; let v=parseInt(localStorage.getItem('views_'+id)||cur.views?.replace('M','')*1000000||1000)+1; localStorage.setItem('views_'+id,v); document.getElementById('viewC').innerText=cur.views||v; document.getElementById('likeC').innerText=localStorage.getItem('likes_'+id)||'24'; loadC(); let aud=document.getElementById('audio'); if(cur.audio){aud.src=cur.audio;aud.style.display='block';} else aud.style.display='none'; }
function closeP(){ document.getElementById('player').style.display='none'; speechSynthesis.cancel(); }
function setV(t){ voiceType=t; document.getElementById('fBtn').className=t==='female'?'vActive':'vOff'; document.getElementById('mBtn').className=t==='male'?'vActive':'vOff'; }
function playS(){ speechSynthesis.cancel(); let txt=document.getElementById('pStory').innerText; let u=new SpeechSynthesisUtterance(txt); let vs=speechSynthesis.getVoices(); if(voiceType==='female'){ u.voice=vs.find(v=>v.name.toLowerCase().includes('female')||v.name.includes('Zira')||v.name.includes('Google UK English Female'))||vs[0]; u.pitch=1.1;} else { u.voice=vs.find(v=>v.name.toLowerCase().includes('male')||v.name.includes('David')||v.name.includes('Google UK English Male'))||vs[1]||vs[0]; u.pitch=0.8;} u.rate=0.9; speechSynthesis.speak(u); document.getElementById('playBtn').innerText='⏸️ Playing...'; u.onend=()=>document.getElementById('playBtn').innerText='▶️ PLAY AUDIO STORY'; }
function stopS(){ speechSynthesis.cancel(); document.getElementById('playBtn').innerText='▶️ PLAY AUDIO STORY'; }
function like(){ if(!cur)return; let id=cur.id; let liked=localStorage.getItem('liked_'+id); let c=parseInt(localStorage.getItem('likes_'+id)||'24'); if(liked){c--; localStorage.removeItem('liked_'+id);} else {c++; localStorage.setItem('liked_'+id,'1');} localStorage.setItem('likes_'+id,c); document.getElementById('likeC').innerText=c; render(); }
function loadC(){ if(!cur)return; let cmts=JSON.parse(localStorage.getItem('comments_'+cur.id)||'[]'); document.getElementById('cmtList').innerHTML=cmts.map(c=>`<div style="background:#1e1e1e;padding:8px;border-radius:8px;margin-top:6px;font-size:12px"><b>${c.name}:</b> ${c.text}</div>`).join('')||'<div style="color:#555;font-size:11px">No comments yet - be first!</div>'; document.getElementById('cmtC').innerText=cmts.length; }
function addC(){ let inp=document.getElementById('cmtIn'); if(!inp.value.trim())return; let cmts=JSON.parse(localStorage.getItem('comments_'+cur.id)||'[]'); cmts.push({name:'Viewer',text:inp.value,time:Date.now()}); localStorage.setItem('comments_'+cur.id,JSON.stringify(cmts)); inp.value=''; loadC(); render(); }
function share(){ if(navigator.share){navigator.share({title:cur.title,url:location.href})} else {navigator.clipboard.writeText(location.href); alert('Link copied!');} }
speechSynthesis.getVoices();
</script>
</body>
  </html>
