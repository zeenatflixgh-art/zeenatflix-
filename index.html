<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeenatFlix GH - Ghana's Netflix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;padding:15px}
h1{color:#ff004f;text-align:center;margin:15px}
#search{width:100%;max-width:400px;display:block;margin:0 auto 15px;padding:12px;border-radius:25px;border:none;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}
.card{background:#111;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover}
.info{padding:8px}
.info h3{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.stats{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:5px}
.actions{display:flex;gap:5px;margin-top:6px}
.actions button{flex:1;font-size:10px;padding:6px;border:none;border-radius:5px}
.vid{background:#ff004f;color:#fff} .aud{background:#00aaff;color:#fff}
.world{background:#111;padding:15px;margin-top:20px;border-radius:10px;text-align:center}
.world button{background:#00ff88;color:#000;padding:12px 25px;border:none;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<h1>ZEENATFLIX GH 🌍</h1>
<input id="search" placeholder="Search movie..." onkeyup="filterMovies()">
<div class="grid" id="grid">Loading your 19 posters...</div>

<div class="world">
<h3>🌎 World Post</h3>
<p>Trending Ghana Stories - 1M+ Views Worldwide!</p>
<button onclick="location.href='world.html'">View World 🌎</button>
</div>

<script>
const repo="zeenatflixgh/zeenatflix-";
async function loadPosters(){
  const res=await fetch(`https://api.github.com/repos/${repo}/contents/`);
  const files=await res.json();
  const grid=document.getElementById('grid'); grid.innerHTML='';
  files.filter(f=>f.name.toLowerCase().endsWith('.jpg')).forEach(f=>{
    const title=f.name.replace('.jpg','').replace(/-/g,' ');
    const views=(Math.floor(Math.random()*9)+1)+"."+(Math.floor(Math.random()*9))+"M";
    const likes=(Math.floor(Math.random()*900)+100)+"K";
    const comments=(Math.floor(Math.random()*50)+10)+"K";
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`
      <img src="${f.name}" loading="lazy">
      <div class="info">
        <h3>${title}</h3>
        <div class="stats"><span>👁️ ${views}</span><span>❤️ ${likes}</span><span>💬 ${comments}</span></div>
        <div class="actions">
          <button class="vid">🎥 Video + Subtitle</button>
          <button class="aud">🎧 Audio</button>
        </div>
      </div>`;
    div.onclick=()=>location.href=`story.html?movie=${encodeURIComponent(f.name)}`;
    grid.appendChild(div);
  });
}
function filterMovies(){ let q=document.getElementById('search').value.toLowerCase(); document.querySelectorAll('.card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(q)?'':'none';});}
loadPosters();
</script>
</body>
</html>
