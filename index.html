<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZEENATFLIX - Ghana Movies</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
.header{background:#111;padding:15px;border-radius:10px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.card{background:#111;border-radius:15px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover}
.card div{padding:10px}
a{color:#fff;text-decoration:none}
.admin{position:fixed;bottom:20px;right:20px;background:#00ff88;color:#000;padding:12px;border-radius:50px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1 style="color:#00ff88;margin:5px">🎬 ZEENATFLIX</h1>
<p style="color:#aaa;margin:0">Ghanaian Audio Movies - Listen Like Radio Drama!</p>
</div>
<div class="grid" id="movies"></div>
<a href="admin.html" class="admin">👑 CEO</a>
<script>
// YOUR MOVIES - Edit here to add for WORLD!
let defaultMovies=[
{
title:"THE GRADUATION BETRAYAL",
img:"https://zeenatflixgh-art.github.io/zeenatflix-/poster1.jpg",
views:"2.1M",
fullstory:"[NARRATOR] In a small village in Ashanti, a true story of jealousy, love and forgiveness. [AMARA] Maakye! I am Amara, 12 years, I want to go to school. [KOFI] Chale, I am Kofi, I will help you. [CHIEF] What is happening in my village? [OLD WOMAN] Me nua, bra ha! Come here my child!"
},
{
title:"MARKET WAR",
img:"https://via.placeholder.com/300x400/FF00AA/fff?text=MARKET+WAR",
views:"1.5M",
fullstory:"[NARRATOR] Kumasi Central Market is on fire with gossip. [AMARA] This is my market stall! [KOFI] No, this is my mother's place! [CHIEF] Enough! Mo mma yen nkɔ court!"
}
];
// Merge with your Admin posts (only on your phone, but defaultMovies show for world)
let saved=JSON.parse(localStorage.getItem("zeenat_movies")||"[]");
let all=[...saved, ...defaultMovies];
let container=document.getElementById("movies");
all.forEach(m=>{
let link=`story.html?title=${encodeURIComponent(m.title)}&img=${encodeURIComponent(m.img)}&fullstory=${encodeURIComponent(m.fullstory||"Story coming soon")}`;
container.innerHTML+=`<a href="${link}" class="card"><img src="${m.img}"><div><b>${m.title}</b><br><small style=color:#aaa>👁️ ${m.views} • Ghana</small></div></a>`;
});
</script>
</body>
</html>
