<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEENATFLIX - Home</title><style>*{box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:0}.header{background:linear-gradient(90deg,#ff1493,orange);padding:15px;position:sticky;top:0;z-index:20}.header h1{margin:0;font-size:22px}.header.nav{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}.header a{color:#fff;text-decoration:none;background:rgba(0,0,0,0.3);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:bold}.search{margin:15px;padding:0 15px}.search input{width:100%;padding:12px;border-radius:25px;border:none;background:#1e1e1e;color:#fff}.statsBar{display:flex;gap:10px;padding:0 15px;margin-bottom:10px;flex-wrap:wrap}.statsBar div{background:#1e1e1e;padding:8px 12px;border-radius:20px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}.card{background:#1e1e1e;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}.card img{width:100%;height:220px;object-fit:cover;background:#2a2a2a;display:block}.badge{position:absolute;top:8px;left:8px;background:#ff1493;color:#fff;font-size:10px;padding:4px 8px;border-radius:10px;font-weight:bold}.card.info{padding:10px}.card h3{margin:0 0 4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card.sub{font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}.meta{display:flex;gap:8px;font-size:11px;color:#888}.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1;padding:6px;border:none;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer}.likeBtn{background:#2a2a2a;color:#ff4d6d}.likeBtn.liked{background:#ff4d6d;color:#fff}.playBtn{background:#00ff9d;color:#000}.commentBtn{background:#333;color:#fff}</style></head><body><div class="header"><h1>🎬 ZEENATFLIX 👑</h1><div class="nav"><a href="index.html">🏠 Home</a><a href="world.html">🌍 World</a><a href="admin.html">👑 CEO Admin</a></div></div><div class="search"><input id="searchInput" placeholder="🔍 Search movies..." oninput="filterMovies()"></div><div class="statsBar"><div>📽️ <span id="totalMovies">0</span> Movies</div><div>👁️ <span id="totalViews">0</span> Views</div><div>❤️ <span id="totalLikes">0</span> Likes</div></div><div class="grid" id="movieGrid"></div><div id="commentModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:99;padding:15px;overflow-y:auto"><div style="background:#1e1e1e;padding:20px;border-radius:15px;max-width:500px;margin:20px auto"><h3 id="commentTitle">Comments</h3><div id="commentList" style="max-height:200px;overflow-y:auto;margin:10px 0;background:#121212;padding:10px;border-radius:10px"></div><input id="commentName" placeholder="Your name" style="width:100%;padding:10px;border-radius:10px;border:none;background:#2a2a2a;color:#fff;margin-bottom:8px"><input id="commentText" placeholder="Write comment..." style="width:100%;padding:10px;border-radius:10px;border:none;background:#2a2a2a;color:#fff;margin-bottom:8px"><div style="display:flex;gap:8px"><button onclick="postComment()" style="flex:1;padding:10px;background:#00ff9d;color:#000;border:none;border-radius:10px;font-weight:bold">Post</button><button onclick="closeComments()" style="flex:1;padding:10px;background:#333;color:#fff;border:none;border-radius:10px">Close</button></div></div></div><script>
const staticPosters=[{title:"THE STOLEN BABY",sub:"She Sold Her Baby For Money",img:"THE-STOLEN-BABY.jpg",views:6100000,likes:12400},{title:"AMARA",sub:"The village girl who became queen",img:"AMARA.jpg",views:3000000,likes:8900},{title:"MISSING BUT FOUND",sub:"Lost in Accra market",img:"MISSING-BUT-FOUND.jpg",views:5600000,likes:15200},{title:"MY STEPMOTHER'S DAUGHTER",sub:"Tried to steal my destiny",img:"MY-STEPMOTHERS-DAUGHTER.jpg",views:2200000,likes:6700},{title:"SECRETS OF THE LETTER",sub:"Letter opened after 20 years",img:"SECRETS-OF-THE-LETTER.jpg",views:4200000,likes:9800},{title:"SHATTERED VOWS",sub:"Broke his vow",img:"SHATTERED-VOWS.jpg",views:1100000,likes:3200},{title:"THE ABANDONED HUTS",sub:"Vanishing of Maame Serwaa",img:"THE-ABANDONED-HUTS.jpg",views:3300000,likes:7400},{title:"THE FOOD SELLER",sub:"Monica's Secret",img:"THE-FOOD-SELLER.jpg",views:2800000,likes:6100},{title:"THE MARKET GIRL",sub:"Market girl story",img:"THE-MARKET-GIRL.jpg",views:1900000,likes:4300},{title:"THE RIVER BRIDE",sub:"River bride mystery",img:"THE-RIVER-BRIDE.jpg",views:2500000,likes:5600},{title:"THE SLAVE TRADE",sub:"Slave trade history",img:"THE-SLAVE-TRADE.jpg",views:4000000,likes:10200},{title:"THE TWINS",sub:"The twins secret",img:"THE-TWINS.jpg",views:3100000,likes:7200},{title:"THE WHITE MAN",sub:"The white man story",img:"THE-WHITE-MAN.jpg",views:2700000,likes:5800},{title:"THE LIBRARY SECRET",sub:"Library secret",img:"THE-LIBRARY-SECRET.jpg",views:1800000,likes:3900},{title:"FORGOTTEN PROMISE",sub:"Forgotten promise",img:"FORGOTTEN-PROMISE.jpg",views:2000000,likes:4500},{title:"DEATH OF NO RETURN",sub:"Death",img:"DEATH-OF-NO-RETURN.jpg",views:3500000,likes:8100},{title:"FOREST OF NO RETURN",sub:"Forest",img:"FOREST-OF-NO-RETURN.jpg",views:2900000,likes:6200},{title:"THE GENEROUS HUNTER",sub:"Generous hunter",img:"THE-GENEROUS-HUNTER.jpg",views:2300000,likes:5000},{title:"THE HEADMASTER SECRET",sub:"Headmaster secret",img:"THE-HEADMASTER-SECRET.jpg",views:2100000,likes:4700}];
let currentCommentMovieId=null;
function formatNum(n){if(n>=1000000)return(n/1000000).toFixed(1)+"M";if(n>=1000)return(n/1000).toFixed(1)+"K";return n;}
function getPostedMovies(){return JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");}
function getLikes(){return JSON.parse(localStorage.getItem('zeenat_likes')||"{}");}
function getViews(){return JSON.parse(localStorage.getItem('zeenat_views')||"{}");}
function getComments(){return JSON.parse(localStorage.getItem('zeenat_comments')||"{}");}
function getMyLikes(){return JSON.parse(localStorage.getItem('zeenat_mylikes')||"[]");}
function renderMovies(filter=""){
 let grid=document.getElementById('movieGrid');grid.innerHTML="";
 let posted=getPostedMovies();let likesData=getLikes();let viewsData=getViews();let commentsData=getComments();let myLikes=getMyLikes();let allMovies=[];
 posted.forEach(m=>{allMovies.push({id:m.id,title:m.title,sub:m.subtitle||m.story.substring(0,40),img:m.image,views:(viewsData[m.id]||0)+100,likes:(likesData[m.id]||0),isPosted:true});});
 staticPosters.forEach((s,i)=>{let id="static_"+i;allMovies.push({id:id,title:s.title,sub:s.sub,img:s.img,views:(viewsData[id]||s.views),likes:(likesData[id]||s.likes),isPosted:false});});
 if(filter){allMovies=allMovies.filter(m=>m.title.toLowerCase().includes(filter.toLowerCase()));}
 document.getElementById('totalMovies').innerText=allMovies.length;
 document.getElementById('totalViews').innerText=formatNum(allMovies.reduce((a,b)=>a+b.views,0));
 document.getElementById('totalLikes').innerText=formatNum(allMovies.reduce((a,b)=>a+b.likes,0));
 allMovies.forEach(m=>{
   let commentCount=(commentsData[m.id]||[]).length;let isLiked=myLikes.includes(m.id);
   let div=document.createElement('div');div.className='card';
   div.innerHTML=`<div class="badge">${m.isPosted?'NEW 🌟':'WORLD 🌍'}</div><img src="${m.img}" onerror="this.src='https://via.placeholder.com/300x400?text=${encodeURIComponent(m.title)}'" onclick="openMovie('${m.id}')"><div class="info"><h3>${m.title}</h3><div class="sub">${m.sub}</div><div class="meta"><span>👁️ ${formatNum(m.views)}</span><span>❤️ ${formatNum(m.likes)}</span><span>💬 ${commentCount}</span></div><div class="actions"><button class="likeBtn ${isLiked?'liked':''}" onclick="likeMovie('${m.id}');event.stopPropagation()">${isLiked?'❤️ Liked':'🤍 Like'}</button><button class="commentBtn" onclick="openComments('${m.id}','${m.title}');event.stopPropagation()">💬 ${commentCount}</button><button class="playBtn" onclick="openMovie('${m.id}')">▶️ Play</button></div></div>`;
   grid.appendChild(div);
 });
}
function openMovie(id){let views=getViews();views[id]=(views[id]||0)+1;localStorage.setItem('zeenat_views',JSON.stringify(views));location.href='story.html?id='+id;}
function likeMovie(id){let likes=getLikes();let myLikes=getMyLikes();if(myLikes.includes(id)){likes[id]=(likes[id]||1)-1;myLikes=myLikes.filter(x=>x!==id);}else{likes[id]=(likes[id]||0)+1;myLikes.push(id);}localStorage.setItem('zeenat_likes',JSON.stringify(likes));localStorage.setItem('zeenat_mylikes',JSON.stringify(myLikes));renderMovies(document.getElementById('searchInput').value);}
function openComments(id,title){currentCommentMovieId=id;document.getElementById('commentTitle').innerText='💬 '+title;document.getElementById('commentModal').style.display='block';renderComments();}
function closeComments(){document.getElementById('commentModal').style.display='none';}
function renderComments(){let comments=getComments();let list=comments[currentCommentMovieId]||[];let html="";if(list.length===0)html="<p style='color:#777;font-size:13px'>No comments yet. Be first!</p>";else list.forEach(c=>{html+=`<div style='margin:8px 0;padding:8px;background:#2a2a2a;border-radius:8px'><b style='color:#00ff9d'>${c.name}:</b> ${c.text}<br><span style='font-size:10px;color:#777'>${c.date}</span></div>`;});document.getElementById('commentList').innerHTML=html;}
function postComment(){let name=document.getElementById('commentName').value.trim()||"Anonymous";let text=document.getElementById('commentText').value.trim();if(!text)return;let comments=getComments();if(!comments[currentCommentMovieId])comments[currentCommentMovieId]=[];comments[currentCommentMovieId].push({name,text,date:new Date().toLocaleString()});localStorage.setItem('zeenat_comments',JSON.stringify(comments));document.getElementById('commentText').value="";renderComments();renderMovies(document.getElementById('searchInput').value);}
function filterMovies(){renderMovies(document.getElementById('searchInput').value);}
renderMovies();
</script></body></html>
