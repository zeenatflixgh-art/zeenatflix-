const posters=[{id:"static_0",t:"THE STOLEN BABY",i:"THE-STOLEN-BABY.jpg",d:"She Sold Her Baby",v:"6.1M"},{id:"static_1",t:"MISSING BUT FOUND",i:"MISSING-BUT-FOUND.jpg",d:"Lost in Accra market",v:"5.6M"},{id:"static_2",t:"SECRETS OF THE LETTER",i:"SECRETS-OF-THE-LETTER.jpg",d:"Letter opened after 20 years",v:"4.2M"},{id:"static_3",t:"THE SLAVE TRADE",i:"THE-SLAVE-TRADE.jpg",d:"Slave trade history",v:"3.9M"},{id:"static_4",t:"THE ABANDONED HUTS",i:"THE-ABANDONED-HUTS.jpg",d:"Vanishing of Maame Serwaa",v:"4.5M"},{id:"static_5",t:"THE TWINS",i:"THE-TWINS.jpg",d:"The twins secret",v:"5.1M"},{id:"static_6",t:"AMARA",i:"AMARA.jpg",d:"Village girl who became queen",v:"6.3M"},{id:"static_7",t:"THE FOOD SELLER",i:"THE-FOOD-SELLER.jpg",d:"Monica's Secret",v:"2.8M"},{id:"static_8",t:"THE WHITE MAN",i:"THE-WHITE-MAN.jpg",d:"The white man story",v:"3.2M"},{id:"static_9",t:"THE RIVER BRIDE",i:"THE-RIVER-BRIDE.jpg",d:"River bride mystery",v:"4.0M"},{id:"static_10",t:"THE GENEROUS HUNTER",i:"THE-GENEROUS-HUNTER.jpg",d:"Generous hunter",v:"2.9M"},{id:"static_11",t:"MY STEPMOTHER'S DAUGHTER",i:"MY-STEPMOTHER.jpg",d:"Tried to steal my destiny",v:"2.2M"},{id:"static_12",t:"THE HEADMASTER SECRET",i:"THE-HEADMASTER-SECRET.jpg",d:"Headmaster secret",v:"3.7M"},{id:"static_13",t:"FORGOTTEN PROMISE",i:"FORGOTTEN-PROMISE.jpg",d:"Forgotten promise",v:"3.0M"},{id:"static_14",t:"THE MARKET GIRL",i:"THE-MARKET-GIRL.jpg",d:"Market girl story",v:"2.5M"},{id:"static_15",t:"THE LIBRARY SECRET",i:"THE-LIBRARY-SECRET.jpg",d:"Library secret",v:"2.7M"},{id:"static_16",t:"DEATH OF NO RETURN",i:"DEATH-OF-NO-RETURN.jpg",d:"Death of no return",v:"4.1M"},{id:"static_17",t:"FOREST OF NO RETURN",i:"FOREST-OF-NO-RETURN.jpg",d:"Forest of no return",v:"4.3M"},{id:"static_18",t:"SHATTERED VOWS",i:"SHATTERED-VOWS.jpg",d:"Broke his vow on wedding night",v:"5.0M"}];
function checkAndOpen(id){
 let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");
 let custom=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]").find(m=>m.id===id);
 if(!stories[id] &&!custom){
   alert("🔒 Full story not yet added by CEO. This poster is locked until story is ready!");
   return;
 }
 location.href='story.html?id='+id;
}
function render(){
 let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");
 let custom=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");
 let html="";let ready=0;
 posters.forEach(p=>{
   let has=stories[p.id]; if(has)ready++;
   let locked=!has;
   html+=`<div class="card" onclick="checkAndOpen('${p.id}')"><span class="badge">WORLD 🌍</span><img src="${p.i}" onerror="this.onerror=null;this.src='https://via.placeholder.com/400x600/1e1e1e/ff1493?text=${encodeURIComponent(p.t)}'">${locked?'<div class="lock">🔒</div>':''}<div class="info"><div class="t">${p.t}</div><div class="d">${p.d}<br>👁️ ${p.v} • World Exclusive ${locked?'• 🔒 Locked':''}</div></div></div>`;
 });
 custom.forEach(m=>{
   html+=`<div class="card" onclick="checkAndOpen('${m.id}')"><span class="badge" style="background:#00ff9d;color:#000">YOUR STORY</span><img src="${m.image}" onerror="this.src='https://via.placeholder.com/400x600/1e1e1e/ff1493?text=${encodeURIComponent(m.title)}'"><div class="info"><div class="t">${m.title}</div><div class="d">${m.desc||''}</div></div></div>`;
 });
 document.getElementById('grid').innerHTML=html;
 document.getElementById('count').innerText=`${custom.length} Your Stories + ${posters.length} World Classics = ${custom.length+posters.length} Total • ${ready} Unlocked`;
}
render();
</script></body></html>
