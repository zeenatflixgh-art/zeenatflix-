<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World - ZeenatFlix</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:15px}
h1{color:#00ff88;text-align:center}
.post{background:#111;border-radius:12px;padding:15px;margin:15px 0;display:flex;gap:10px;align-items:center}
.post img{width:80px;height:100px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<a href="index.html" style="color:#ff004f">← Back Home</a>
<h1>🌎 World Trending</h1>
<p style="text-align:center">Ghana Stories Trending Worldwide - 1M+ Views!</p>
<div id="worldgrid">Loading world posts...</div>
<script>
const repo="zeenatflixgh/zeenatflix-";
async function load(){
  const res=await fetch(`https://api.github.com/repos/${repo}/contents/`);
  const files=await res.json();
  const g=document.getElementById('worldgrid'); g.innerHTML='';
  files.filter(f=>f.name.toLowerCase().endsWith('.jpg')).forEach(f=>{
    const title=f.name.replace('.jpg','').replace(/-/g,' ');
    g.innerHTML+=`<div class="post"><img src="${f.name}"><div><h3>${title}</h3><p>👁️ 1.${Math.floor(Math.random()*9)}M | ❤️ 250K | 💬 45K</p><p>🌍 Posted to World from Ghana</p></div></div>`;
  });
}
load();
</script>
</body>
</html>
