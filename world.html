<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World - ZEENATFLIX</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.header{background:linear-gradient(90deg,#00ff88,#00ccff);padding:18px;text-align:center;border-radius:16px;margin:8px}
.header h1{margin:0;font-size:28px;font-weight:900;color:#000}
.header p{margin:5px 0 0;color:#000}
.nav{display:flex;gap:10px;padding:10px 12px}
.nav a{flex:1;text-align:center;padding:12px;border-radius:25px;text-decoration:none;font-weight:900}
.home{background:#fff;color:#000}
.world{background:#00ff88;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#151515;border-radius:14px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:270px;object-fit:cover}
.info{padding:10px}
</style>
</head><body>
<div class="header"><h1>🌍 WORLD TRENDING</h1><p>Global Hits - Tap to Listen!</p></div>
<div class="nav">
<a class="home" href="index.html">🏠 HOME - Ghana</a>
<a class="world" href="world.html">🌍 WORLD</a>
</div>
<div class="grid" id="grid"></div>
<script>
const worldPosters=[
{t:"KOREAN DRAMA LOVE",v:"15M",i:"https://via.placeholder.com/300x400?text=Korean+Love"},
{t:"AMERICAN ACTION",v:"12M",i:"https://via.placeholder.com/300x400?text=USA+Action"},
{t:"NOLLYWOOD KING",v:"8M",i:"https://via.placeholder.com/300x400?text=Nollywood"},
{t:"BOLLYWOOD BEATS",v:"10M",i:"https://via.placeholder.com/300x400?text=Bollywood"},
];
let html="";
worldPosters.forEach(p=>{
 html+=`<div class="card"><img src="${p.i}"><div class="info"><b>${p.t}</b><br><small>👁️ ${p.v} • World</small></div></div>`;
});
document.getElementById('grid').innerHTML=html;
</script></body></html>
