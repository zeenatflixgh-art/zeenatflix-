<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeenatflix GH World</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0}header{background:#111;padding:12px;position:sticky;top:0;display:flex;justify-content:space-between} .hero{background:linear-gradient(#222,#000);padding:40px 15px;text-align:center} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;max-width:900px;margin:auto} @media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr}} .card{background:#111;border-radius:10px;overflow:hidden;border:1px solid #222} .card img{width:100%;height:160px;object-fit:cover} .card div{padding:10px} .btn{background:#e50914;color:#fff;padding:6px 10px;border-radius:4px;text-decoration:none;display:inline-block;margin-top:6px;font-size:13px}</style></head><body>
<header><a href="index.html" style="color:#e50914;text-decoration:none">← Back to Zeenatflix GH</a><span>🌍 WORLD</span></header>
<div class="hero"><h1>Zeenatflix WORLD 🌍</h1><p>Videos + Audios + Stories - Global</p></div>
<div class="grid" id="grid"></div>
<script>
const all=[{id:1,title:"AMARA",img:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=600"},{id:2,title:"SHATTERED VOWS",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600"}];
for(let i=3;i<=19;i++) all.push({id:i,title:"STORY "+i,img:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600"});
document.getElementById('grid').innerHTML=all.map(s=>`<div class=card><img src="${s.img}"><div><b>${s.title}</b><br><a class=btn href="story.html?id=${s.id}">▶️ Play Video/Audio</a></div></div>`).join('');
</script></body></html>
