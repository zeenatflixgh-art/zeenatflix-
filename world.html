<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORLD - Zeenatflix GH</title>
<style>
body{margin:0;background:#121212;color:#fff;font-family:Arial}
header{background:linear-gradient(90deg,#0099ff,#00ff88);padding:18px;text-align:center;position:sticky;top:0;z-index:99}
header h1{margin:0;font-size:28px;letter-spacing:2px;font-weight:900}
.searchBox{padding:12px;background:#1a1a1a;position:sticky;top:68px;z-index:98}
#search{width:100%;padding:14px;border-radius:25px;border:1px solid #333;background:#2a2a2a;color:#fff;font-size:15px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#1e1e1e;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #2a2a2a;position:relative}
.card img{width:100%;height:240px;object-fit:cover}
.info{padding:10px}.card h3{margin:0;font-size:12px;color:#00ff88;text-transform:uppercase}.card p{margin:6px 0 0;font-size:14px;font-weight:bold}.meta{font-size:11px;color:#888;display:flex;gap:12px;margin-top:6px}
.locked img{filter:brightness(0.4) grayscale(0.3)}.lock-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);padding:8px 14px;border-radius:20px;font-size:18px;border:1px solid #444}
.nav{padding:10px;text-align:center;background:#111}a{color:#00ff88;text-decoration:none;margin:0 10px;font-weight:bold}
</style>
</head><body>
<header><h1>WORLD 🌎</h1><p style="margin:5px 0 0;font-size:13px"><span id="total">0</span> - Foreign Stories</p></header>
<div class="nav"><a href="index.html">🏠 HOME</a> | <a href="world.html">🌎 WORLD</a> | <a href="admin.html" style="color:#121212">.</a></div>
<div class="searchBox"><input type="text" id="search" placeholder="🔍 Search WORLD..." onkeyup="render()"></div>
<div class="grid" id="grid"></div>
<script>
const posters=[
{id:"static_0",t:"THE STOLEN BABY",d:"Stolen Child",i:"THE-STOLEN-BABY.jpg",c:"africa"},
{id:"static_1",t:"MISSING BUT FOUND",d:"Lost 7 Years",i:"MISSING-BUT-FOUND.jpg",c:"africa"},
{id:"static_2",t:"SECRETS OF THE LETTER",d:"Letter Secret",i:"SECRETS-OF-THE-LETTER.jpg",c:"africa"},
{id:"static_3",t:"THE SLAVE TRADE",d:"Slave Story",i:"THE-SLAVE-TRADE.jpg",c:"africa"},
{id:"static_4",t:"THE ABANDONED HUTS",d:"Hut Secrets",i:"THE-ABANDONED-HUTS.jpg",c:"africa"},
{id:"static_5",t:"THE TWINS",d:"Twin Drama",i:"THE-TWINS.jpg",c:"africa"},
{id:"static_6",t:"AMARA",d:"Housegirl To Bride",i:"AMARA.jpg",c:"africa"},
{id:"static_7",t:"THE FOOD SELLER",d:"Market Story",i:"THE-FOOD-SELLER.jpg",c:"africa"},
{id:"static_8",t:"THE WHITE MAN",d:"White Man",i:"THE-WHITE-MAN.jpg",c:"world"},
{id:"static_9",t:"THE RIVER BRIDE",d:"Love Beyond Waters",i:"THE-RIVER-BRIDE.jpg",c:"world"},
{id:"static_10",t:"THE GENEROUS HUNTER",d:"Golden Heart",i:"THE-GENEROUS-HUNTER.jpg",c:"africa"},
{id:"static_11",t:"MY STEPMOTHER'S DAUGHTER",d:"Stepmother",i:"MY-STEPMOTHER.jpg",c:"africa"},
{id:"static_12",t:"THE HEADMASTER SECRET",d:"School Secret",i:"THE-HEADMASTER-SECRET.jpg",c:"africa"},
{id:"static_13",t:"FORGOTTEN PROMISE",d:"Promise",i:"FORGOTTEN-PROMISE.jpg",c:"africa"},
{id:"static_14",t:"THE MARKET GIRL",d:"Market Girl",i:"THE-MARKET-GIRL.jpg",c:"africa"},
{id:"static_15",t:"THE LIBRARY SECRET",d:"Book Survived Fire",i:"THE-LIBRARY-SECRET.jpg",c:"world"},
{id:"static_16",t:"DEATH OF NO RETURN",d:"Death Story",i:"DEATH-OF-NO-RETURN.jpg",c:"africa"},
{id:"static_17",t:"FOREST OF NO RETURN",d:"Forest",i:"FOREST-OF-NO-RETURN.jpg",c:"africa"},
{id:"static_18",t:"SHATTERED VOWS",d:"Vows",i:"SHATTERED-VOWS.jpg",c:"africa"}
];
function checkAndOpen(id){let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");let custom=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]").find(m=>m.id==id);if(!stories[id]&&!custom){alert("⏳ Coming Soon! Try another 🔓");return;}location.href='story.html?id='+id;}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");
 let customMovies=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");
 let all=[...posters];
 customMovies.forEach(cm=>{if(!all.find(p=>p.id==cm.id)){all.unshift({id:cm.id,t:cm.title,d:cm.desc||"New",i:cm.image,c:cm.category||"both"});}});
 let html="";let c=0;
 all.forEach(p=>{
  if(p.c!="world" && p.c!="both"){return;}
  if(p.t.toLowerCase().includes(q)||p.d.toLowerCase().includes(q)){
   c++;let views=JSON.parse(localStorage.getItem('zeenat_views')||"{}")[p.id]||0;
   let likes=JSON.parse(localStorage.getItem('zeenat_likes')||"{}")[p.id]||0;
   let has=stories[p.id]||customMovies.find(m=>m.id==p.id);
   let imgData=localStorage.getItem('zeenat_poster_img_'+p.id);let imgSrc=imgData||p.i;
   let lockHtml=!has?`<div class="lock-badge">🔒</div>`:`<div style="position:absolute;top:8px;right:8px;background:rgba(0,255,100,0.9);color:#000;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold">🔓 OPEN</div>`;
   html+=`<div class="card ${!has?'locked':''}" onclick="checkAndOpen('${p.id}')"><img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/300x400?text=${encodeURIComponent(p.t)}'">${lockHtml}<div class="info"><h3>${p.t}</h3><p>${p.d}</p><div class="meta"><span>👁️ ${views}</span><span>❤️ ${likes}</span></div></div></div>`;
  }
 });
 document.getElementById('grid').innerHTML=html;document.getElementById('total').innerText=c+" World Stories";
}
render();
</script></body></html>
