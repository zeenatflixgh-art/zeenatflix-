<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD PEOPLE</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:10px}.header{background:linear-gradient(90deg,orange,#ff1493);padding:15px;border-radius:15px;text-align:center}.header a{color:#fff;text-decoration:none;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.card{background:#1e1e1e;border-radius:12px;overflow:hidden}.card img{width:100%;height:240px;object-fit:cover;background:#222;display:block}.info{padding:10px}.info h3{margin:5px 0;font-size:13px}.info p{margin:0;font-size:11px;color:#aaa}</style></head><body><div class="header"><h2>🌍 WORLD PEOPLE</h2><p>Global Stories from ZEENATFLIX CEO</p><a href="index.html">← Home</a> | <a href="admin.html">👑 Admin</a></div><div class="grid" id="grid"></div><script>
const movies=[
{t:"MISSING BUT FOUND",img:"MISSING-BUT-FOUND.jpg",d:"Lost in Accra market...",v:"5.6M"},
{t:"MY STEPMOTHER'S DAUGHTER",img:"STEPMOTHER.jpg",d:"Tried to steal my destiny...",v:"2.2M"},
{t:"SECRETS OF THE LETTER",img:"SECRETS-OF-THE-LETTER.jpg",d:"Letter opened after 20 years...",v:"4.2M"},
{t:"SHATTERED VOWS",img:"SHATTERED-VOWS.jpg",d:"Broke his vow...",v:"1.1M"},
{t:"THE ABANDONED HUTS",img:"THE-ABANDONED-HUTS.jpg",d:"Vanishing of Maame Serwaa",v:"3.3M"},
{t:"THE FOOD SELLER",img:"THE-FOOD-SELLER.jpg",d:"Monica's Secret",v:"2.8M"}
];
const grid=document.getElementById('grid');
// Show your gallery posts first
let posted=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");
posted.forEach(m=>{
 let d=document.createElement('div');d.className='card';
 d.innerHTML=`<img src="${m.image}"><div class="info"><h3>${m.title}</h3><p>${m.subtitle||''}</p><p>👁️ NEW • 🌍 World</p></div>`;
 d.onclick=()=>location.href='story.html?id='+m.id;
 grid.appendChild(d);
});
// Show 6 main posters with cache-buster ?v=5
movies.forEach(m=>{
 let d=document.createElement('div');d.className='card';
 d.innerHTML=`<img src="${m.img}?v=5" onerror="this.src='https://via.placeholder.com/300x400?text=${encodeURIComponent(m.t)}'"><div class="info"><h3>${m.t}</h3><p>${m.d}</p><p>👁️ ${m.v} • 🌍 World Exclusive</p></div>`;
 grid.appendChild(d);
});
</script></body></html>
