<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story - ZEENATFLIX</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:15px}
.poster{width:100%;max-width:400px;border-radius:15px}
.card{background:#111;border-radius:15px;padding:15px;margin:15px 0}
.video{width:100%;height:220px;background:#222;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#888}
.btn{background:#ff0055;color:#fff;padding:12px 25px;border-radius:25px;border:none;margin:5px;font-weight:bold}
.back{color:#00ff88;text-decoration:none}
.stats{color:#0f0}
</style>
</head>
<body>
<a href="index.html" class="back">⬅ Back to ZEENATFLIX</a>
<h1 id="title"></h1>
<img id="img" class="poster">
<div class="card"><h3>🎬 Video Player + Subtitles (English / Twi)</h3><div class="video">▶️ Video Coming Soon - Subtitles ON</div><p>Subtitles ON</p></div>
<div class="card"><h3>📖 Full Story</h3><p id="story">Full Ghana movie story will be here... This is ZeenatFlix original! Trending #1 in Ghana!</p></div>
<div class="card"><p class="stats">👁️ <span id="v"></span> Views | ❤️ <span id="l"></span> Likes | 💬 <span id="c"></span> Comments | 🌍 World Trending</p></div>
<div style="text-align:center">
<button class="btn" onclick="share()">📤 Share Movie</button>
</div>
<script>
let p=new URLSearchParams(location.search);
document.getElementById("title").innerText=p.get("title")||"Movie";
document.getElementById("img").src=p.get("img")||"";
document.getElementById("v").innerText=p.get("views")||"1.5M";
document.getElementById("l").innerText=p.get("likes")||"125K";
document.getElementById("c").innerText=p.get("comments")||"35K";
function share(){
if(navigator.share){navigator.share({title:p.get("title"),url:location.href})}
else{prompt("Copy link:",location.href)}
}
</script>
</body>
</html>
