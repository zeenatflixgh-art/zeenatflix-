<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story - ZEENATFLIX</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:0}
.header{padding:15px;background:#1a1a1a;display:flex;justify-content:space-between}
.header a{color:#ff7a45;text-decoration:none;font-weight:bold}
.hero{position:relative}
.hero img{width:100%;height:380px;object-fit:cover}
.hero.overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, #000);padding:20px}
.controls{background:#1e1e1e;margin:15px;border-radius:15px;padding:15px;position:sticky;top:0;z-index:10}
.controls button{padding:12px 18px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:4px}
#playBtn{background:#00ff9d;color:#000}
#stopBtn{background:#ff1493;color:#fff}
#pauseBtn{background:#444;color:#fff}
.storyText{background:#1e1e1e;margin:15px;padding:20px;border-radius:15px;line-height:1.9;font-size:16px;white-space:pre-wrap}
.charTag{color:#00ff9d;font-weight:bold}
.progress{width:100%;height:6px;background:#333;border-radius:10px;overflow:hidden;margin-top:10px}
.progress div{height:100%;background:#00ff9d;width:0%}
</style>
</head>
<body>
<div class="header"><a href="index.html">← Home</a><a href="world.html">🌍 World</a></div>
<div class="hero"><img id="heroImg" src=""><div class="overlay"><h2 id="heroTitle"></h2><p id="heroSub" style="color:#ccc"></p></div></div>
<div class="controls">
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
<button id="playBtn" onclick="playStory()">▶️ Play AI Story</button>
<button id="pauseBtn" onclick="pauseStory()">⏸️ Pause</button>
<button id="stopBtn" onclick="stopStory()">⏹️ Stop</button>
<select id="speed" style="padding:8px;border-radius:8px;background:#2a2a2a;color:#fff;border:none"><option value="0.8">Slow</option><option value="1" selected>Normal</option><option value="1.3">Fast</option></select>
</div>
<div class="progress"><div id="prog"></div></div>
<p id="nowSpeaking" style="color:#00ff9d;font-weight:bold;margin:8px 0;font-size:14px">🎭 Click Play - AI will use different voices!</p>
<p id="voiceList" style="color:#aaa;font-size:12px"></p>
</div>
<div class="storyText" id="storyText">Loading...</div>
<script>
let movie=null,voices=[],isPlaying=false,currentLine=0,storyLines=[];
function getVoices(){voices=speechSynthesis.getVoices();}
speechSynthesis.onvoiceschanged=getVoices;getVoices();
function loadMovie(){
 let id=new URLSearchParams(location.search).get('id');
 let movies=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");
 movie=movies.find(m=>String(m.id)===String(id));
 if(!movie){if(movies.length>0)movie=movies[0];else movie={title:"Demo: Multi-Voice",subtitle:"How it works",image:"AMARA.jpg",story:"Narrator: Welcome to Zeenatflix PRO!\nKofi: Hello, I am Kofi, Ghana English.\nAma: I am Ama, Twi.\nJohn: I am John, British English.\nChinedu: I be Chinedu, Pidgin!",characters:[{name:"Narrator",voice:"en-GB"},{name:"Kofi",voice:"en-GH"},{name:"Ama",voice:"ak"},{name:"John",voice:"en-GB"},{name:"Chinedu",voice:"pcm"}],lang:"en-GB",audio:""};}
 document.getElementById('heroImg').src=movie.image;
 document.getElementById('heroTitle').innerText=movie.title;
 document.getElementById('heroSub').innerText=movie.subtitle||"";
 document.getElementById('voiceList').innerText="🎭 Characters: "+(movie.characters||[]).map(c=>c.name+" ("+c.voice+")").join(", ");
 storyLines=movie.story.split("\n").filter(l=>l.trim());
 let html="";storyLines.forEach(line=>{let m=line.match(/^([^:]{1,25}):\s*(.*)/);if(m){html+=`<span class="charTag">${m[1]}:</span> ${m[2]}\n\n`;}else{html+=line+"\n\n";}});document.getElementById('storyText').innerHTML=html;
}
function getVoiceFor(name){
 let char=(movie.characters||[]).find(c=>c.name.toLowerCase()===name.toLowerCase());
 let lang=char?char.voice:movie.lang;
 let map={"en-GB":"en-GB","en-US":"en-US","en-GH":"en-GH","en-NG":"en-NG","pcm":"en-NG","ak":"en-GH","yo":"en-NG","ig":"en-NG","ha":"en-NG","fr":"fr-FR","es":"es-ES","en":"en-US"};
 let target=map[lang]||"en-US";
 return voices.find(x=>x.lang===target)||voices.find(x=>x.lang.startsWith(target.split('-')[0]))||voices[0];
}
function playStory(){
 if(isPlaying)return;
 if(movie.audio&&movie.audio.includes('.mp3')){new Audio(movie.audio).play();document.getElementById('nowSpeaking').innerText="🔊 Playing MP3";return;}
 isPlaying=true;currentLine=0;speakNext();
}
function speakNext(){
 if(currentLine>=storyLines.length){isPlaying=false;document.getElementById('nowSpeaking').innerText="✅ Finished!";document.getElementById('prog').style.width="100%";return;}
 let line=storyLines[currentLine];let charName="Narrator";let text=line;let m=line.match(/^([^:]{1,25}):\s*(.*)/);if(m){charName=m[1].trim();text=m[2];}
 let utter=new SpeechSynthesisUtterance(text);let voice=getVoiceFor(charName);if(voice)utter.voice=voice;utter.rate=parseFloat(document.getElementById('speed').value);
 document.getElementById('nowSpeaking').innerText="🎙️ "+charName+" speaking... ["+(voice?voice.name:"")+"]";
 document.getElementById('prog').style.width=((currentLine/storyLines.length)*100)+"%";
 utter.onend=()=>{currentLine++;setTimeout(speakNext,400);};utter.onerror=()=>{currentLine++;speakNext();};speechSynthesis.speak(utter);
}
function pauseStory(){if(speechSynthesis.speaking)speechSynthesis.pause();else speechSynthesis.resume();}
function stopStory(){speechSynthesis.cancel();isPlaying=false;currentLine=0;document.getElementById('prog').style.width="0%";}
loadMovie();
</script>
</body>
</html>
