<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story</title><style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:10px}.top{background:linear-gradient(90deg,#ff1493,orange);padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.top a{color:#fff;text-decoration:none;font-weight:bold;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:20px}.poster{width:100%;border-radius:12px;max-height:400px;object-fit:cover}.storyBox{background:#1e1e1e;padding:15px;border-radius:12px;line-height:1.7;white-space:pre-wrap;margin-top:10px}.btn{padding:10px 18px;border:none;border-radius:25px;font-weight:bold;cursor:pointer}.like{background:#ff1493;color:#fff}.cmt{background:#2a2a2a;padding:10px;border-radius:8px;margin:8px 0}</style></head><body><div class="top"><a href="index.html">⬅️ Home</a><span id="viewCount">👁️ 1 views</span><a href="world.html">🌍 World</a></div><img id="posterImg" class="poster"><h1 id="title" style="font-size:22px"></h1><div id="storyText" class="storyBox"></div><div style="display:flex;gap:10px;margin:15px 0"><button class="btn like" onclick="likeStory()">❤️ Like (<span id="likeNum">0</span>)</button><button class="btn" style="background:#00ff9d;color:#000" onclick="navigator.clipboard.writeText(location.href);alert('Copied!')">🔗 Share</button></div><div style="background:#1e1e1e;padding:12px;border-radius:12px"><h3>💬 Comments (<span id="cmtCount">0</span>)</h3><input id="cmtName" placeholder="Your name" style="width:100%;padding:10px;border-radius:8px;border:none;background:#2a2a2a;color:#fff;margin:5px 0;box-sizing:border-box"><textarea id="cmtText" placeholder="Write comment..." style="width:100%;padding:10px;border-radius:8px;border:none;background:#2a2a2a;color:#fff;margin:5px 0;box-sizing:border-box"></textarea><button class="btn" style="background:#ff1493;color:#fff;width:100%" onclick="addComment()">Post Comment</button><div id="cmtList"></div></div><script>const staticPosters=[{t:"THE STOLEN BABY",i:"THE-STOLEN-BABY.jpg"},{t:"MISSING BUT FOUND",i:"MISSING-BUT-FOUND.jpg"},{t:"SECRETS OF THE LETTER",i:"SECRETS-OF-THE-LETTER.jpg"},{t:"THE SLAVE TRADE",i:"THE-SLAVE-TRADE.jpg"},{t:"THE ABANDONED HUTS",i:"THE-ABANDONED-HUTS.jpg"},{t:"THE TWINS",i:"THE-TWINS.jpg"},{t:"AMARA",i:"AMARA.jpg"},{t:"THE FOOD SELLER",i:"THE-FOOD-SELLER.jpg"},{t:"THE WHITE MAN",i:"THE-WHITE-MAN.jpg"},{t:"THE RIVER BRIDE",i:"THE-RIVER-BRIDE.jpg"},{t:"THE GENEROUS HUNTER",i:"THE-GENEROUS-HUNTER.jpg"},{t:"MY STEPMOTHER'S DAUGHTER",i:"STEPMOTHER.jpg"},{t:"THE HEADMASTER SECRET",i:"THE-HEADMASTER-SECRET.jpg"},{t:"FORGOTTEN PROMISE",i:"FORGOTTEN-PROMISE.jpg"},{t:"THE MARKET GIRL",i:"THE-MARKET-GIRL.jpg"},{t:"THE LIBRARY SECRET",i:"THE-LIBRARY-SECRET.jpg"},{t:"DEATH OF NO RETURN",i:"DEATH-OF-NO-RETURN.jpg"},{t:"FOREST OF NO RETURN",i:"FOREST-OF-NO-RETURN.jpg"},{t:"SHATTERED VOWS",i:"SHATTERED-VOWS.jpg"}];function getId(){return new URLSearchParams(location.search).get('id')}function load(){let id=getId();let posterStories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");let data=null;if(id&&id.startsWith('static_')){let idx=parseInt(id.replace('static_',''));let s=staticPosters[idx];if(s)data={title:s.t,img:s.i,story:posterStories[id]||""}}let posted=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");let f=posted.find(m=>m.id==id);if(f)data={title:f.title,img:f.image,story:f.story||posterStories[id]||""};if(!data){document.getElementById('title').innerText="Not found";return}document.getElementById('title').innerText=data.title;document.getElementById('posterImg').src=data.img;document.getElementById('posterImg').onerror=function(){this.src='https://via.placeholder.com/600x400/1e1e1e/ff1493?text='+encodeURIComponent(data.title)};document.getElementById('storyText').innerText=data.story||"No story added yet. Go to Admin to add!";let views=JSON.parse(localStorage.getItem('zeenat_views')||"{}");views[id]=(views[id]||0)+1;localStorage.setItem('zeenat_views',JSON.stringify(views));document.getElementById('viewCount').innerText="👁️ "+views[id]+" views";let likes=JSON.parse(localStorage.getItem('zeenat_likes')||"{}");document.getElementById('likeNum').innerText=likes[id]||0;loadComments()}function likeStory(){let id=getId();let likes=JSON.parse(localStorage.getItem('zeenat_likes')||"{}");likes[id]=(likes[id]||0)+1;localStorage.setItem('zeenat_likes',JSON.stringify(likes));document.getElementById('likeNum').innerText=likes[id]}function loadComments(){let id=getId();let all=JSON.parse(localStorage.getItem('zeenat_comments')||"{}");let list=all[id]||[];document.getElementById('cmtCount').innerText=list.length;let h="";list.slice().reverse().forEach(c=>{h+=`<div class="cmt"><b>${c.name}</b><br>${c.text}<br><small style="color:#aaa">${c.time}</small></div>`});document.getElementById('cmtList').innerHTML=h}function addComment(){let id=getId();let name=document.getElementById('cmtName').value||"Anonymous";let text=document.getElementById('cmtText').value;if(!text.trim())return alert("Write comment!");let all=JSON.parse(localStorage.getItem('zeenat_comments')||"{}");if(!all[id])all[id]=[];all[id].push({name,text,time:new Date().toLocaleString()});localStorage.setItem('zeenat_comments',JSON.stringify(all));document.getElementById('cmtText').value="";loadComments()}load()</script></body></html>
