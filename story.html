<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story - ZEENATFLIX</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:15px}
.poster{width:100%;max-width:400px;border-radius:15px;display:block;margin:10px auto}
.card{background:#111;border-radius:15px;padding:15px;margin:15px 0}
.btn{color:#fff;padding:12px 18px;border-radius:25px;border:none;margin:5px;font-weight:bold;font-size:14px}
.btnF{background:#ff00aa}.btnM{background:#0088ff}.btnG{background:#00ff88;color:#000;width:95%;font-size:16px}.btnS{background:#333}
.back{color:#00ff88;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<a href="index.html" class="back">⬅ Back to ZEENATFLIX</a>
<h1 id="title" style="text-align:center"></h1>
<img id="img" class="poster">
<div class="card">
<p id="story" style="font-size:16px;line-height:1.7"></p>
</div>
<div class="card" style="text-align:center;background:#1a1a1a">
<h3 style="margin:0">🎧 Listen to Story</h3>
<p style="color:#aaa;font-size:12px">AI will read with different voices</p>
<button class="btn btnF" onclick="speakFemale()">👩 Female Voice</button>
<button class="btn btnM" onclick="speakMale()">👨 Male Voice</button>
<br><br>
<button class="btn btnG" onclick="speakDrama()">▶️ Play Movie Drama</button>
<br><br>
<button class="btn btnS" onclick="stop()">⏹️ Stop</button>
</div>
<script>
let p=new URLSearchParams(location.search);
document.getElementById("title").innerText=p.get("title")||"Movie";
document.getElementById("img").src=p.get("img")||"";
let storyEl=document.getElementById("story");
let raw=p.get("fullstory")||p.get("story")||"Movie story coming soon...";
let cleanText=raw.replace(/\[.*?\]/g," ").replace(/\s+/g," ").trim();
storyEl.innerText=cleanText||raw;
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith("en"));if(voices.length===0)voices=speechSynthesis.getVoices();}
speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,800);
function getVoice(isFemale){
if(voices.length===0)return null;
let f=voices.find(v=>v.name.toLowerCase().includes("female")||v.name.includes("Zira"));
let m=voices.find(v=>v.name.toLowerCase().includes("male")||v.name.includes("David"));
if(isFemale)return f||voices[0];
return m||voices[1]||voices[0];
}
function speakFemale(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cleanText);let v=getVoice(true);if(v)u.voice=v;u.rate=0.9;speechSynthesis.speak(u);}
function speakMale(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cleanText);let v=getVoice(false);if(v)u.voice=v;u.rate=0.9;speechSynthesis.speak(u);}
function speakDrama(){
let text=raw;let regex=/\[(.*?)\]/g;let last=0;let queue=[];let m;
while((m=regex.exec(text))!==null){
if(m.index>last){let t=text.substring(last,m.index).trim();if(t)queue.push({tag:"NARRATOR",text:t});}
last=regex.lastIndex;let next=text.indexOf("[",last);let end=next>=0?next:text.length;
let t=text.substring(last,end).trim();if(t)queue.push({tag:m[1],text:t});
last=end;regex.lastIndex=last;
}
if(queue.length===0)queue.push({tag:"NARRATOR",text:cleanText});
speechSynthesis.cancel();let i=0;
function next(){
if(i>=queue.length)return;
let item=queue[i];
let u=new SpeechSynthesisUtterance(item.text);
let isFemale=item.tag.toUpperCase().includes("AMARA")||item.tag.toUpperCase().includes("GIRL")||item.tag.toUpperCase().includes("WOMAN");
let v=getVoice(isFemale);if(v)u.voice=v;
if(isFemale){u.pitch=1.2;}else{u.pitch=0.9;}
u.rate=0.9;
u.onend=()=>{i++;next();}
speechSynthesis.speak(u);
}
next();
}
function stop(){speechSynthesis.cancel()}
</script>
</body>
</html>
