<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeenatflix Story</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}header{background:linear-gradient(90deg,#ff1493,orange);padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}header a{color:#fff;text-decoration:none;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:bold}.wrap{padding:12px;max-width:700px;margin:auto}.poster{width:100%;border-radius:12px;max-height:420px;object-fit:cover}.title{font-size:22px;font-weight:bold;margin:12px 0}.sub{background:#000;color:#ffeb3b;padding:10px;border-radius:8px;text-align:center;margin:10px 0;border:1px solid #333;min-height:28px}.story{background:#1e1e1e;padding:14px;border-radius:12px;line-height:1.8;white-space:pre-wrap;font-size:15px}.card{background:#1e1e1e;padding:12px;border-radius:12px;margin:12px 0}.btn{padding:12px 18px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;margin:4px}.play{width:100%;background:#ff1493;color:#fff;font-size:17px;padding:14px}.like{background:#ff1493;color:#fff}.share{background:#00ff9d;color:#000}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}select,textarea{width:100%;padding:12px;border-radius:8px;border:none;background:#2a2a2a;color:#fff;margin:6px 0;box-sizing:border-box}</style></head><body><header><a href="index.html">⬅️ Home</a><div id="v">👁️ 0</div><a href="world.html">🌍 World</a></header><div class="wrap"><img id="img" class="poster"><div id="t" class="title"></div><div id="lock" style="display:none;background:#1e1e1e;padding:40px 20px;border-radius:12px;text-align:center"><h2>🔒 Coming Soon</h2><p>This full story is not yet published by CEO.</p><a href="index.html" style="color:#ff1493">Back Home</a></div><div id="main"><div class="card"><h3>🎧 Listen to Story Voice</h3><select id="lang"><option value="en-GH">🇬🇭 Ghana English</option><option value="en-NG">🇳🇬 Nigeria English</option><option value="en-GB">🇬🇧 British English</option><option value="ig-NG">Igbo</option><option value="yo-NG">Yoruba</option><option value="ha-NG">Hausa</option></select><div id="sub" class="sub">Tap PLAY to listen...</div><div class="grid2"><button class="btn play" onclick="playS()">▶️ PLAY ⏯️</button><button class="btn" style="background:orange;color:#000;width:100%" onclick="speechSynthesis.pause()">⏸️ PAUSE</button><button class="btn" style="background:#ff4757;color:#fff;width:100%" onclick="speechSynthesis.cancel()">⏹️ STOP</button><button class="btn" style="background:#2a2a2a;color:#fff;width:100%" onclick="speechSynthesis.resume()">▶️ RESUME</button></div></div><div id="story" class="story"></div><div class="card"><button class="btn like" onclick="like()">❤️ Like (<span id="lc">0</span>)</button><button class="btn share" onclick="navigator.share?navigator.share({title:t.innerText,url:location.href}):prompt('Copy:',location.href)">🔗 Share</button></div><div class="card"><h3>💬 Comments (<span id="cc">0</span>)</h3><textarea id="ct" placeholder="Write comment..."></textarea><button class="btn play" onclick="comment()">Post Comment</button><div id="cl"></div></div></div></div><script>
const id=new URLSearchParams(location.search).get('id');const posters={"static_0":{t:"THE STOLEN BABY",i:"THE-STOLEN-BABY.jpg"},"static_1":{t:"MISSING BUT FOUND",i:"MISSING-BUT-FOUND.jpg"},"static_2":{t:"SECRETS OF THE LETTER",i:"SECRETS-OF-THE-LETTER.jpg"},"static_3":{t:"THE SLAVE TRADE",i:"THE-SLAVE-TRADE.jpg"},"static_4":{t:"THE ABANDONED HUTS",i:"THE-ABANDONED-HUTS.jpg"},"static_5":{t:"THE TWINS",i:"THE-TWINS.jpg"},"static_6":{t:"AMARA",i:"AMARA.jpg"},"static_7":{t:"THE FOOD SELLER",i:"THE-FOOD-SELLER.jpg"},"static_8":{t:"THE WHITE MAN",i:"THE-WHITE-MAN.jpg"},"static_9":{t:"THE RIVER BRIDE",i:"THE-RIVER-BRIDE.jpg"},"static_10":{t:"THE GENEROUS HUNTER",i:"THE-GENEROUS-HUNTER.jpg"},"static_11":{t:"MY STEPMOTHER'S DAUGHTER",i:"STEPMOTHER.jpg"},"static_12":{t:"THE HEADMASTER SECRET",i:"THE-HEADMASTER-SECRET.jpg"},"static_13":{t:"FORGOTTEN PROMISE",i:"FORGOTTEN-PROMISE.jpg"},"static_14":{t:"THE MARKET GIRL",i:"THE-MARKET-GIRL.jpg"},"static_15":{t:"THE LIBRARY SECRET",i:"THE-LIBRARY-SECRET.jpg"},"static_16":{t:"DEATH OF NO RETURN",i:"DEATH-OF-NO-RETURN.jpg"},"static_17":{t:"FOREST OF NO RETURN",i:"FOREST-OF-NO-RETURN.jpg"},"static_18":{t:"SHATTERED VOWS",i:"SHATTERED-VOWS.jpg"}};let voices=[];function lv(){voices=speechSynthesis.getVoices()}speechSynthesis.onvoiceschanged=lv;lv();
function getD(){let cust=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]").find(m=>m.id===id);if(cust)return cust;let mp=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");let p=posters[id];if(!p)return null;return {title:p.t,image:p.i,story:mp[id]||""}}
function init(){let d=getD();if(!d||!d.story||d.story.trim().length<20){document.getElementById('lock').style.display='block';document.getElementById('main').style.display='none';document.getElementById('t').innerText=(d?d.title:"Story")+" 🔒";document.getElementById('img').src=d?d.image:"";return}document.getElementById('t').innerText=d.title;document.getElementById('img').src=d.image;document.getElementById('img').onerror=function(){this.src='https://via.placeholder.com/600x400/1e1e1e/ff1493?text='+encodeURIComponent(d.title)};document.getElementById('story').innerText=d.story;let vw=JSON.parse(localStorage.getItem('zeenat_views')||"{}");vw[id]=(vw[id]||0)+1;localStorage.setItem('zeenat_views',JSON.stringify(vw));document.getElementById('v').innerText='👁️ '+vw[id];let lk=JSON.parse(localStorage.getItem('zeenat_likes')||"{}");document.getElementById('lc').innerText=lk[id]||0;loadC()}function playS(){let txt=document.getElementById('story').innerText;if(!txt)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang=document.getElementById('lang').value;let v=voices.find(x=>x.lang===u.lang)||voices.find(x=>x.lang.startsWith(u.lang.split('-')[0]))||voices.find(x=>x.lang.includes('en'))||voices[0];if(v)u.voice=v;u.rate=0.9;u.onboundary=function(e){document.getElementById('sub').innerText=txt.substring(Math.max(0,e.charIndex-20),e.charIndex+50)};u.onend=function(){document.getElementById('sub').innerText="✅ Finished"};speechSynthesis.speak(u);document.getElementById('sub').innerText="▶️ Playing..."}function like(){let l=JSON.parse(localStorage.getItem('zeenat_likes')||"{}");l[id]=(l[id]||0)+1;localStorage.setItem('zeenat_likes',JSON.stringify(l));document.getElementById('lc').innerText=l[id]}function loadC(){let all=JSON.parse(localStorage.getItem('zeenat_comments')||"{}")[id]||[];document.getElementById('cc').innerText=all.length;let h="";all.forEach(x=>h+=`<div style='background:#2a2a2a;padding:8px;border-radius:8px;margin:6px 0'>${x.text}<br><small style='color:#888'>${x.time}</small></div>`);document.getElementById('cl').innerHTML=h}function comment(){let t=document.getElementById('ct').value.trim();if(!t)return;let all=JSON.parse(localStorage.getItem('zeenat_comments')||"{}");if(!all[id])all[id]=[];all[id].push({text:t,time:new Date().toLocaleString()});localStorage.setItem('zeenat_comments',JSON.stringify(all));document.getElementById('ct').value="";loadC()}init();
</script></body></html>
