<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story - ZEENATFLIX</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding-bottom:80px}
.header{background:linear-gradient(90deg,#ff0080,#ff8a00);padding:14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:99}
.header button{background:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:900;cursor:pointer}
.posterBox{margin:12px;border-radius:14px;overflow:hidden;background:#151515;border:1px solid #222}
.posterBox img{width:100%;height:380px;object-fit:cover}
.content{padding:14px}
.content h1{margin:0;font-size:24px}
.stats{display:flex;gap:12px;margin:10px 0;flex-wrap:wrap;font-size:13px;color:#aaa}
.stats span{background:#1a1a1a;padding:6px 12px;border-radius:20px}
.playBox{display:flex;gap:10px;margin:14px 0}
.playBtn{flex:1;background:linear-gradient(90deg,#ff0080,#ff8a00);border:none;color:#fff;padding:14px;border-radius:25px;font-weight:900;font-size:16px;cursor:pointer}
.likeBtn{background:#1a1a1a;border:1px solid #333;color:#fff;padding:14px 18px;border-radius:25px;cursor:pointer}
.storyText{line-height:1.8;font-size:16px;white-space:pre-wrap;background:#151515;padding:16px;border-radius:12px;border:1px solid #222;margin:12px 0}
.parts{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.parts button{background:#222;border:1px solid #333;color:#fff;padding:8px 16px;border-radius:20px;white-space:nowrap;cursor:pointer}
.parts button.active{background:#ff0080;border-color:#ff0080}
.commentBox{margin:14px;padding:14px;background:#151515;border-radius:12px;border:1px solid #222}
.commentBox h3{margin:0 0 10px}
.commentBox input{width:100%;padding:12px;border-radius:10px;border:none;background:#222;color:#fff;box-sizing:border-box}
.comment{padding:10px 0;border-bottom:1px solid #222;font-size:14px}
.shareBox{display:flex;gap:8px;margin:12px 0}
.shareBtn{flex:1;background:#00ff88;color:#000;border:none;padding:12px;border-radius:25px;font-weight:900;cursor:pointer}
</style>
</head><body>
<div class="header"><button onclick="history.back()">⬅ Back</button><b id="headTitle">ZEENATFLIX</b></div>
<div class="posterBox"><img id="posterImg" src=""></div>
<div class="content">
<h1 id="title"></h1>
<div class="stats">
<span id="views">👁️ 0 views</span>
<span id="likes">❤️ 0 likes</span>
<span id="commentsCount">💬 0 comments</span>
<span>⭐ 4.9</span>
</div>
<div class="playBox">
<button class="playBtn" id="playBtn" onclick="togglePlay()">⏯️ Tap to Listen</button>
<button class="likeBtn" onclick="like()">❤️ Like</button>
</div>
<div class="parts" id="parts"></div>
<div class="storyText" id="storyText">Loading story...</div>
<div class="shareBox">
<button class="shareBtn" onclick="shareLink()">🔗 Share Link</button>
<button class="shareBtn" style="background:#fff" onclick="copyLink()">📋 Copy Link</button>
</div>
<div class="commentBox">
<h3>💬 Comments</h3>
<input id="commentInput" placeholder="Write a comment..." onkeydown="if(event.key==='Enter')addComment()">
<div id="commentList" style="margin-top:10px"></div>
</div>
</div>
<script>
let id=new URLSearchParams(location.search).get('id');
let currentPart=0, isPlaying=false, utter=null;
function getStory(){
 let all=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");
 let custom=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]").find(m=>m.id==id);
 if(all[id]) return all[id];
 if(custom) return {title:custom.title,parts:[custom.story||custom.parts?.[0]||"Story coming soon"],image:custom.image};
 return null;
}
function load(){
 let data=getStory();
 if(!data){document.getElementById('storyText').innerHTML="⏳ Coming Soon! This story not posted yet. Go to Admin and post story for this poster!";return;}
 document.getElementById('title').innerText=data.title||id;
 document.getElementById('headTitle').innerText=data.title||"ZEENATFLIX";
 let img=localStorage.getItem('zeenat_poster_img_'+id)||data.image||"";
 if(img) document.getElementById('posterImg').src=img;
 // views
 let vKey='zeenat_views_'+id;let v=parseInt(localStorage.getItem(vKey)||"0")+1;localStorage.setItem(vKey,v);
 document.getElementById('views').innerText=`👁️ ${v.toLocaleString()} views`;
 // likes
 let lKey='zeenat_likes_'+id;let l=parseInt(localStorage.getItem(lKey)||"0");document.getElementById('likes').innerText=`❤️ ${l} likes`;
 // parts
 let parts=data.parts||[data.story||""];
 let pHtml="";parts.forEach((p,i)=>{pHtml+=`<button class="${i==0?'active':''}" onclick="showPart(${i})">Part ${i+1}</button>`});
 document.getElementById('parts').innerHTML=pHtml;
 showPart(0);
 loadComments();
}
function showPart(i){
 currentPart=i;
 let data=getStory();let parts=data.parts||[data.story];
 document.getElementById('storyText').innerText=parts[i]||"";
 document.querySelectorAll('.parts button').forEach((b,idx)=>{b.className=idx==i?'active':''});
 if(isPlaying){speechSynthesis.cancel();isPlaying=false;document.getElementById('playBtn').innerText="⏯️ Tap to Listen";}
}
function togglePlay(){
 let text=document.getElementById('storyText').innerText;
 if(!text) return;
 if(isPlaying){speechSynthesis.cancel();isPlaying=false;document.getElementById('playBtn').innerText="⏯️ Tap to Listen";return;}
 utter=new SpeechSynthesisUtterance(text);utter.rate=0.9;
 utter.onend=()=>{isPlaying=false;document.getElementById('playBtn').innerText="⏯️ Tap to Listen";};
 speechSynthesis.speak(utter);isPlaying=true;document.getElementById('playBtn').innerText="⏸️ Pause";
}
function like(){
 let k='zeenat_likes_'+id;let v=parseInt(localStorage.getItem(k)||"0")+1;localStorage.setItem(k,v);
 document.getElementById('likes').innerText=`❤️ ${v} likes`;
}
function loadComments(){
 let k='zeenat_comments_'+id;let list=JSON.parse(localStorage.getItem(k)||"[]");
 document.getElementById('commentsCount').innerText=`💬 ${list.length} comments`;
 document.getElementById('commentList').innerHTML=list.map(c=>`<div class="comment">👤 ${c}</div>`).join('')||"<small style='color:#777'>No comments yet. Be first!</small>";
}
function addComment(){
 let inp=document.getElementById('commentInput');let val=inp.value.trim();if(!val) return;
 let k='zeenat_comments_'+id;let list=JSON.parse(localStorage.getItem(k)||"[]");list.unshift(val);localStorage.setItem(k,JSON.stringify(list));
 inp.value="";loadComments();
}
function shareLink(){
 let url=location.href;
 if(navigator.share){navigator.share({title:document.getElementById('title').innerText,url});}
 else{copyLink();}
}
function copyLink(){navigator.clipboard.writeText(location.href);alert("🔗 Link copied! "+location.href);}
load();
</script></body></html>
