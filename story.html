<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch - Zeenatflix GH</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding:12px}
.back{color:#e50914;text-decoration:none}.wrap{max-width:800px;margin:15px auto}
video, audio{width:100%;border-radius:10px;margin:12px 0;background:#111}
.video-box{background:#111;padding:12px;border-radius:10px;border:1px solid #222;margin:12px 0}
img.main{width:100%;max-height:350px;object-fit:cover;border-radius:10px}
h1{margin:10px 0}.tag{color:#aaa}.content{line-height:1.8;background:#111;padding:18px;border-radius:10px;margin:12px 0;white-space:pre-wrap}
.btn{background:#e50914;color:#fff;padding:10px 18px;border:none;border-radius:5px;cursor:pointer;margin:4px}
</style></head><body>
<a class="back" href="index.html">← Back</a><div class="wrap" id="wrap">Loading...</div>
<script>
const stories=[
{id:1,title:"AMARA",tag:"Housegirl to KNUST",cat:"Video",img:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=600",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",story:"AMARA full story..."},
{id:2,title:"SHATTERED VOWS",tag:"He married her sister",cat:"Video",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",audio:"",story:"Adwoa story..."}];
for(let i=3;i<=19;i++){stories.push({id:i,title:"STORY "+i,tag:"Ghana Story "+i,cat:"Drama",img:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",audio:"",story:"Full Ghana story "+i})}
let id=parseInt(new URLSearchParams(location.search).get('id')||localStorage.getItem('zeenat_current')||1);
let s=stories.find(x=>x.id===id)||stories[0];
document.getElementById('wrap').innerHTML=`
<img class="main" src="${s.img}"><h1>${s.title}</h1><div class="tag">${s.tag}</div>
<div class="video-box"><h3>🎥 Watch Video</h3><video controls poster="${s.img}"><source src="${s.video}" type="video/mp4"></video></div>
<div class="video-box"><h3>🎧 Listen Audio Drama</h3><audio controls><source src="${s.audio}" type="audio/mpeg"></audio><button class="btn" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('${s.title}'))">🔊 AI Speak</button></div>
<div class="content">${s.story}</div><div style="margin-top:15px"><a href="index.html" class="btn" style="text-decoration:none;background:#222">Next Story</a></div>`;
</script></body></html>
